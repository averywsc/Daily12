<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Conduit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: the wall of a boiler room, riveted iron plates with dark seams. A brass nameplate hangs at the top with
   a little steam pipe on it. The board is a riveted iron panel; every tile is a small plate holding a length of
   copper pipe with brass flanges. Tap a tile to give it a quarter turn. Pipes that water has reached glow blue
   inside, and the blue runs outward from the brass valve wheel one tile at a time. A pressure gauge on the side
   climbs as more tiles get wet. Under the board a short line says how many are still dry. */
:root {
  --iron: #2f363b; --plate: #3d454c; --copper: #cb7a4b; --copperD: #6e3a20; --brass: #dcb35a; --water: #55cfec; --paper: #efe7d4; --ink: #22272b; --text: #e8edef; --muted: #a9b4ba;
  --head: 'Oswald', 'Arial Narrow', 'Helvetica Neue', sans-serif; --body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1); --grain: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--iron); }
body {
  margin: 0; min-height: 100dvh; color: var(--text); font: 500 17px/1.45 var(--body); position: relative; overflow-x: clip;
  background:
    var(--grain),
    radial-gradient(circle at center, #8a939a 0 2.4px, #14181b 3.6px, transparent 4.6px) 20px 208px / 44px 232px repeat-x,
    repeating-linear-gradient(0deg, transparent 0 228px, #12161a 228px 232px, rgba(255, 255, 255, 0.09) 232px 234px),
    radial-gradient(90% 55% at 50% 0%, rgba(255, 255, 255, 0.12), transparent 70%),
    radial-gradient(120% 100% at 50% 40%, transparent 50%, rgba(0, 0, 0, 0.45)),
    var(--iron);
  padding-block: 0 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p, ol { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }
.wrap { position: relative; max-width: 1120px; margin: 0 auto; }

/* ---------- top ---------- */
.top { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 24px; padding: 34px 0 20px; }
.plate { position: relative; margin-top: 0; padding: 22px 36px 14px; text-align: center; color: #3b2a08; border-radius: 0 0 10px 10px;
  background:
    radial-gradient(circle at center, #6d5320 0 2px, #f6e3a4 3px, transparent 4px) 8px 8px / 10px 10px no-repeat,
    radial-gradient(circle at center, #6d5320 0 2px, #f6e3a4 3px, transparent 4px) calc(100% - 8px) 8px / 10px 10px no-repeat,
    var(--grain), linear-gradient(180deg, #ecd088, #cba04b 55%, #b98a38);
  box-shadow: inset 0 0 0 2px rgba(80, 50, 5, 0.45), inset 0 2px 0 rgba(255, 245, 200, 0.6), 0 14px 20px -8px rgba(0, 0, 0, 0.75); }
.plate h1 { font: 700 clamp(2rem, 5vw, 2.7rem)/1 var(--head); letter-spacing: 0.14em; text-transform: uppercase; text-shadow: 0 1px 0 rgba(255, 245, 200, 0.7), 0 -1px 0 rgba(80, 50, 5, 0.5); }
.plate p { font: 600 0.74rem/1.2 var(--body); letter-spacing: 0.16em; text-transform: uppercase; margin-top: 6px; opacity: 0.8; }
.stack { position: absolute; right: 26px; top: -22px; width: 18px; height: 26px; background: linear-gradient(90deg, #9c5a33, var(--copper) 45%, #a86238); border-radius: 3px 3px 0 0; box-shadow: inset 0 0 0 1px rgba(60, 25, 5, 0.5); }
.stack::before { content: ""; position: absolute; left: -3px; right: -3px; top: 0; height: 6px; background: linear-gradient(180deg, #f1d58e, #b98a38); border-radius: 2px; }
.puff { position: absolute; left: 50%; top: -4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: rgba(240, 244, 246, 0.8); filter: blur(1.5px); opacity: 0; animation: puff 3.6s ease-out infinite; }
.puff:nth-child(2) { animation-delay: 1.2s; } .puff:nth-child(3) { animation-delay: 2.4s; }
@keyframes puff { 0% { opacity: 0; transform: translate(0, 0) scale(0.5); } 15% { opacity: 0.85; } 100% { opacity: 0; transform: translate(14px, -50px) scale(2.2); } }
.tools { display: flex; align-items: center; gap: 12px; margin-left: auto; flex-wrap: wrap; }
.tabs, .sizes { display: flex; padding: 4px; border-radius: 999px; background: rgba(15, 20, 23, 0.55); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.18); }
.tabs button, .sizes button { cursor: pointer; padding: 9px 18px; border: 0; border-radius: 999px; font: 700 0.92rem/1 var(--body); background: transparent; color: var(--muted); transition: background 0.35s var(--ease), color 0.35s; }
.sizes button { padding: 9px 13px; }
.tabs button[aria-pressed="true"], .sizes button[aria-pressed="true"] { background: var(--brass); color: #2a1e06; }
.help { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font: 700 1.1rem/1 var(--head); color: #2a1e06; background: var(--brass); border: 0; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5); transition: transform 0.35s var(--ease); }
.help:hover { transform: rotate(10deg) scale(1.1); }

/* ---------- layout ---------- */
.work { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: clamp(22px, 3.4vw, 48px); align-items: start; justify-content: center; }
.left, .right { display: grid; gap: 18px; min-width: 0; }
.left { justify-items: center; }
.stat { width: min(100%, 520px); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 700 0.76rem/1.2 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.stat b { font: 600 1.5rem/1 var(--head); letter-spacing: 0.02em; color: var(--text); font-variant-numeric: tabular-nums; }
.stat span { display: flex; align-items: baseline; gap: 8px; }
.right .stat { width: 100%; }

/* ---------- board ---------- */
.mount { --cols: 6; --rows: 7; position: relative; width: min(100%, 520px, max(260px, calc((100dvh - 260px) * var(--cols) / var(--rows)))); padding: clamp(14px, 2.8vw, 20px); border-radius: 8px;
  background:
    radial-gradient(circle at center, #aab1b7 0 2.5px, #14181b 3.6px, transparent 4.6px) 5px 5px / 12px 12px no-repeat,
    radial-gradient(circle at center, #aab1b7 0 2.5px, #14181b 3.6px, transparent 4.6px) calc(100% - 5px) 5px / 12px 12px no-repeat,
    radial-gradient(circle at center, #aab1b7 0 2.5px, #14181b 3.6px, transparent 4.6px) 5px calc(100% - 5px) / 12px 12px no-repeat,
    radial-gradient(circle at center, #aab1b7 0 2.5px, #14181b 3.6px, transparent 4.6px) calc(100% - 5px) calc(100% - 5px) / 12px 12px no-repeat,
    var(--grain), linear-gradient(180deg, #4b545b, #3a424a);
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.15), 0 24px 34px -12px rgba(0, 0, 0, 0.8); }
.grid { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 3px; }
.tile { position: relative; aspect-ratio: 1; padding: 0; border: 0; border-radius: 4px; cursor: pointer; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  background:
    radial-gradient(circle at center, #838b92 0 1.4px, #14181b 2.2px, transparent 3px) 4px 4px / 7px 7px no-repeat,
    radial-gradient(circle at center, #838b92 0 1.4px, #14181b 2.2px, transparent 3px) calc(100% - 4px) 4px / 7px 7px no-repeat,
    radial-gradient(circle at center, #838b92 0 1.4px, #14181b 2.2px, transparent 3px) 4px calc(100% - 4px) / 7px 7px no-repeat,
    radial-gradient(circle at center, #838b92 0 1.4px, #14181b 2.2px, transparent 3px) calc(100% - 4px) calc(100% - 4px) / 7px 7px no-repeat,
    var(--grain), var(--plate);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), inset 0 -2px 0 rgba(0, 0, 0, 0.4), 0 0 0 1px #14181b; transition: box-shadow 0.5s var(--ease), transform 0.2s; transition-delay: var(--d, 0s), 0s; }
.tile:active:not(.lock) { transform: scale(0.95); }
.tile.wet { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), inset 0 0 16px rgba(85, 207, 236, 0.32), 0 0 0 1px #14181b; }
.tile.lock { cursor: default; }
.tile.lock::after { content: ""; position: absolute; right: 5px; bottom: 5px; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1c0, var(--brass) 55%, #7a5a1c); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
.tile .pipe { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform 0.4s cubic-bezier(0.3, 1.55, 0.5, 1); }
.pipe path { fill: none; }
.pipe .po { stroke: var(--copperD); stroke-width: 31; }
.pipe .pb { stroke: var(--copper); stroke-width: 25; }
.pipe .ph { stroke: rgba(255, 230, 200, 0.4); stroke-width: 5; }
.pipe .pw { stroke: var(--water); stroke-width: 13; opacity: 0; transition: opacity 0.35s ease; transition-delay: var(--d, 0s); filter: drop-shadow(0 0 3px rgba(85, 207, 236, 0.8)); }
.pipe .hub { fill: var(--copper); stroke: var(--copperD); stroke-width: 3; }
.pipe .hw { fill: var(--water); opacity: 0; transition: opacity 0.35s ease; transition-delay: var(--d, 0s); }
.pipe .fl { fill: var(--brass); stroke: #6d5320; stroke-width: 1.5; }
.pipe .rv { fill: #6e3a20; }
.tile.wet .pw, .tile.wet .hw { opacity: 1; }
.valve { position: absolute; left: 50%; top: 50%; width: 74%; height: 74%; margin: -37% 0 0 -37%; pointer-events: none; filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.6)); }
.valve .wheel { transform-origin: 50px 50px; transform-box: view-box; }
.mount.won .tile { animation: glow 1.3s ease-out both; animation-delay: var(--g, 0s); }
@keyframes glow { 0% { filter: none; } 40% { filter: brightness(1.5) saturate(1.2); } 100% { filter: none; } }
.coach { width: min(100%, 520px); min-height: 3em; text-align: center; color: var(--muted); font-size: 0.98rem; }
.coach b { display: block; font: 600 1.25rem/1.2 var(--head); letter-spacing: 0.03em; color: var(--text); margin-bottom: 2px; }

/* ---------- side ---------- */
.gauge { display: grid; justify-items: center; gap: 4px; }
.gauge svg { width: min(100%, 190px); height: auto; filter: drop-shadow(0 12px 12px rgba(0, 0, 0, 0.55)); }
.gauge .needle { transform-origin: 80px 80px; transition: transform 1s cubic-bezier(0.3, 1.4, 0.5, 1); }
.gauge p { font: 700 0.72rem/1 var(--body); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.acts { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { white-space: nowrap; cursor: pointer; padding: 12px 18px; border-radius: 999px; border: 0; font: 700 0.95rem/1 var(--body); color: #2a1e06; background: linear-gradient(180deg, #f1d58e, var(--brass)); box-shadow: 0 4px 0 #7a5a1c, 0 8px 12px rgba(0, 0, 0, 0.45); transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease); }
.btn:hover:not(:disabled) { transform: translateY(-2px); } .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #7a5a1c; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.dark { color: var(--text); background: linear-gradient(180deg, #4d575f, #3a424a); box-shadow: 0 4px 0 #14181b, 0 8px 12px rgba(0, 0, 0, 0.45); }
.btn.ghost { color: var(--text); background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.35); }
.slip { position: relative; width: min(100%, 520px); padding: 22px 22px 20px; text-align: center; color: var(--ink); background: var(--paper); border-radius: 4px; box-shadow: 0 18px 28px -10px rgba(0, 0, 0, 0.8); }
.slip h2 { font: 700 2rem/1 var(--head); letter-spacing: 0.04em; text-transform: uppercase; }
.slip p { margin-top: 6px; }
.slip .stats { display: flex; justify-content: center; gap: 26px; margin: 14px 0 4px; }
.slip .stats div { display: grid; gap: 3px; } .slip .stats b { font: 600 1.8rem/1 var(--head); font-variant-numeric: tabular-nums; } .slip .stats span { font: 700 0.68rem/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.6; }
.slip .foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
.slip .btn.ghost { color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(34, 39, 43, 0.5); }
.slip .next { margin-top: 12px; font: 700 0.74rem/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.6; font-variant-numeric: tabular-nums; }
.record h3 { font: 700 0.72rem/1 var(--body); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); padding-bottom: 10px; border-bottom: 1.5px solid rgba(255, 255, 255, 0.2); margin-bottom: 12px; }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.nums div { display: grid; gap: 4px; } .nums b { font: 600 1.55rem/1 var(--head); font-variant-numeric: tabular-nums; } .nums span { font: 700 0.62rem/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

/* ---------- how to play ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 14px max(14px, env(safe-area-inset-left, 0px)); background: rgba(8, 12, 14, 0.72); animation: fadein 0.3s ease-out both; }
@keyframes fadein { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(22px) rotate(-1deg); } }
.how { --loop: 14s; width: 100%; max-width: 470px; max-height: 100%; overflow: auto; padding: 24px 22px 20px; display: grid; gap: 14px; color: var(--ink); background: var(--paper); border-radius: 6px; box-shadow: 0 30px 70px -10px rgba(0, 0, 0, 0.8); animation: rise 0.55s var(--ease) both; }
.how h2 { font: 700 1.8rem/1 var(--head); letter-spacing: 0.04em; text-transform: uppercase; }
.how .lead { margin-top: -6px; opacity: 0.8; }
.demo { display: grid; gap: 12px; justify-items: center; padding: 16px 14px 12px; background: var(--iron); border-radius: 6px; color: var(--text); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.4); }
.dgrid { width: min(100%, 216px); display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 8px; background: linear-gradient(180deg, #4b545b, #3a424a); border-radius: 6px; box-shadow: 0 8px 14px -6px rgba(0, 0, 0, 0.7); }
.dgrid .tile { cursor: default; }
.tap { position: absolute; left: 50%; top: 50%; width: 36%; height: 36%; margin: -18% 0 0 -18%; border-radius: 50%; border: 3px solid #fff; opacity: 0; pointer-events: none; z-index: 3; }
.dcap { position: relative; width: 100%; height: 2.7em; font-size: 0.95rem; text-align: center; }
.dcap span { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; line-height: 1.3; }
.dcap span:nth-child(1) { animation: k1 var(--loop) infinite; } .dcap span:nth-child(2) { animation: k2 var(--loop) infinite; } .dcap span:nth-child(3) { animation: k3 var(--loop) infinite; } .dcap span:nth-child(4) { animation: k4 var(--loop) infinite; }
@keyframes k1 { 0%, 1% { opacity: 0; } 4%, 17% { opacity: 1; } 20%, 100% { opacity: 0; } }
@keyframes k2 { 0%, 19% { opacity: 0; } 22%, 52% { opacity: 1; } 55%, 100% { opacity: 0; } }
@keyframes k3 { 0%, 54% { opacity: 0; } 57%, 70% { opacity: 1; } 73%, 100% { opacity: 0; } }
@keyframes k4 { 0%, 72% { opacity: 0; } 76%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
.how ol { list-style: none; padding: 0; display: grid; gap: 10px; counter-reset: s; }
.how li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.how li::before { content: counter(s); width: 28px; height: 28px; display: grid; place-items: center; font: 600 1rem/1 var(--head); color: #2a1e06; background: var(--brass); border-radius: 50%; }
.how .foot3 { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.how .foot3 p { font-size: 0.88rem; opacity: 0.7; }

@media (max-width: 960px) { .work { grid-template-columns: minmax(0, 1fr); } .tools { margin-left: 0; } .gauge svg { width: 150px; } }
@media (max-width: 440px) { .tabs button { padding: 9px 14px; } .nums b { font-size: 1.35rem; } .plate { padding: 22px 26px 12px; } .tile { border-radius: 3px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="plate"><div class="stack" aria-hidden="true"><i class="puff"></i><i class="puff"></i><i class="puff"></i></div><h1>Conduit</h1><p id="sub"></p></div>
    <div class="tools">
      <div class="tabs" role="group" aria-label="Mode"><button type="button" id="mDaily" aria-pressed="true">Daily</button><button type="button" id="mEndless" aria-pressed="false">Endless</button></div>
      <div class="sizes" id="sizes" role="group" aria-label="Board size" hidden><button type="button" data-z="0" aria-pressed="false">Small</button><button type="button" data-z="1" aria-pressed="true">Medium</button><button type="button" data-z="2" aria-pressed="false">Large</button></div>
      <button type="button" class="help" id="helpBtn" aria-label="How to play">?</button>
    </div>
  </header>

  <main class="work">
    <div class="left">
      <div class="stat"><span>Wet tiles <b id="wet">0/0</b></span><span>Turns <b id="tn">0</b></span></div>
      <div class="mount" id="mount"><div class="grid" id="grid" role="grid" aria-label="Pipe tiles"></div></div>
      <div class="coach" id="coach" aria-live="polite"></div>
      <div class="slip" id="slip" hidden></div>
    </div>
    <div class="right">
      <div class="gauge">
        <svg viewBox="0 0 160 160" role="img" aria-label="Pressure gauge">
          <circle cx="80" cy="80" r="77" fill="#7a5a1c"/><circle cx="80" cy="80" r="74" fill="#dcb35a"/><circle cx="80" cy="80" r="67" fill="#efe7d4"/><circle cx="80" cy="80" r="67" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="2"/>
          <path d="M80 80 L80 80" stroke="none"/>
          <g id="ticks"></g>
          <text x="80" y="108" text-anchor="middle" font-family="Oswald, sans-serif" font-size="11" letter-spacing="2" fill="#4a4338">PRESSURE</text>
          <g class="needle" id="needle" style="transform: rotate(-120deg)"><path d="M80 84 L77 40 L80 22 L83 40 L80 84Z" fill="#b3321c"/><path d="M80 84 L80 22" stroke="rgba(255,255,255,.4)" stroke-width="1"/></g>
          <circle cx="80" cy="80" r="8" fill="#3a424a"/><circle cx="80" cy="80" r="3" fill="#dcb35a"/>
        </svg>
        <p id="gtxt">Dry</p>
      </div>
      <div class="stat"><span>Time <b id="clock">00:00</b></span><span id="hintn"></span></div>
      <div class="acts" id="acts"><button type="button" class="btn" id="hint">Hint</button><button type="button" class="btn dark" id="giveup">Show answer</button></div>
      <section class="record" aria-label="Record"><h3 id="recT">Record</h3><div class="nums" id="nums"></div></section>
    </div>
  </main>
</div>

<div class="overlay" id="ov" hidden><div class="how" id="how" role="dialog" aria-modal="true" aria-labelledby="howT"></div></div>

<script>
// Conduit rules. No DOM in here.
// A board is a grid of pipe tiles. Each tile has openings on some of its four sides (N=1, E=2, S=4, W=8).
// Turning a tile a quarter turn clockwise moves every opening one side round. Water flows from the valve
// tile through any two touching openings. The board is solved when water reaches every tile.

const EPOCH = '2026-11-09';
const N = 1, E = 2, S = 4, W = 8;
const DIRS = [[0, -1, N, S], [1, 0, E, W], [0, 1, S, N], [-1, 0, W, E]];

function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function dateKey(d) {
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function dayNumber(key) {
  const [y, m, d] = key.split('-').map(Number);
  const [ey, em, ed] = EPOCH.split('-').map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(ey, em - 1, ed)) / 86400000) + 1;
}
function fmtTime(ms) {
  const s = Math.floor(ms / 1000), p = (x) => String(x).padStart(2, '0');
  return p(Math.floor(s / 60)) + ':' + p(s % 60);
}

function rot(mask, r) { r = ((r % 4) + 4) % 4; for (let i = 0; i < r; i++) mask = ((mask << 1) | (mask >> 3)) & 15; return mask; }
function canonOf(mask) { let best = 99; for (let r = 0; r < 4; r++) best = Math.min(best, rot(mask, r)); return best; }
function kindOf(mask) {
  let c = 0; for (let i = 0; i < 4; i++) if (mask & (1 << i)) c++;
  if (c === 1) return 'cap'; if (c === 3) return 'tee'; if (c === 4) return 'cross';
  return (mask === 5 || mask === 10) ? 'straight' : 'elbow';
}

      h += '<line x1="' + (80 + Math.sin(a) * r1).toFixed(1) + '" y1="' + (80 - Math.cos(a) * r1).toFixed(1) + '" x2="' + (80 + Math.sin(a) * r2).toFixed(1) + '" y2="' + (80 - Math.cos(a) * r2).toFixed(1) + '" stroke="' + (i >= 9 ? '#b3321c' : '#4a4338') + '" stroke-width="' + (big ? 2.5 : 1.5) + '" stroke-linecap="round"/>';
    }
    $('ticks').innerHTML = h;
  })();

  /* ---------- how to play ---------- */
  /* A 3x3 board on a loop. Three tiles are the wrong way round; each gets a tap, and the water follows. */
  var DEMO = [2, 14, 12, 6, 13, 5, 1, 1, 1];
  function demo() {
    var off = { 4: 270, 3: 270, 5: 90 }, tapAt = { 4: 20, 3: 36, 5: 50 }, wetAt = [3, 5, 7, 40, 26, 54, 43, 29, 57], css = '', h = '<div class="dgrid">', i;
    for (i = 0; i < 9; i++) {
      var a = off[i] || 0, T = tapAt[i], nm = 'dd' + i;
      if (T) {
        css += '@keyframes ' + nm + 'r{0%,' + T + '%{transform:rotate(' + a + 'deg)}' + (T + 5) + '%,97%{transform:rotate(' + (a + 90) + 'deg)}97.01%,100%{transform:rotate(' + a + 'deg)}}';
        css += '@keyframes ' + nm + 't{0%,' + (T - 2) + '%{opacity:0;transform:scale(.4)}' + T + '%{opacity:.95;transform:scale(.8)}' + (T + 6) + '%{opacity:0;transform:scale(1.5)}100%{opacity:0}}';
        css += '.' + nm + ' .pipe{animation:' + nm + 'r var(--loop) infinite;transition:none}.' + nm + ' .tap{animation:' + nm + 't var(--loop) infinite}';
      }
      css += '@keyframes ' + nm + 'w{0%,' + wetAt[i] + '%{opacity:0}' + (wetAt[i] + 3) + '%,97%{opacity:1}97.01%,100%{opacity:0}}';
      css += '.' + nm + ' .pw,.' + nm + ' .hw{animation:' + nm + 'w var(--loop) infinite;transition:none}';
      css += '@keyframes ' + nm + 'g{0%,' + (wetAt[i] + 2) + '%{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px #14181b}' + (wetAt[i] + 5) + '%,97%{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 16px rgba(85,207,236,.32),0 0 0 1px #14181b}97.01%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px #14181b}}.' + nm + '{animation:' + nm + 'g var(--loop) infinite;transition:none}';
      h += '<div class="tile ' + nm + '" style="cursor:default">' + pipeSvg(DEMO[i]).replace('<svg class="pipe"', '<svg class="pipe" style="transform:rotate(' + a + 'deg)"') + (i === 0 ? VALVE : '') + (T ? '<i class="tap"></i>' : '') + '</div>';
    }
    css += '.dgrid .tile.dd0 .wheel{animation:dspin var(--loop) linear infinite}@keyframes dspin{0%,3%{transform:rotate(0)}30%,100%{transform:rotate(360deg)}}';
    return { css: css, html: h + '</div>' };
  }
  function howHtml(d) {
    var h = '<h2 id="howT">How to play</h2><p class="lead">Water starts at the brass valve. Turn the pipes so it reaches every tile.</p><div class="demo">' + d.html + '<div class="dcap"><span>The pipes are twisted. Water flows out of the valve.</span><span>Tap a tile to turn it a quarter turn.</span><span>Keep joining pipes. Wet pipes glow blue.</span><span>Every tile is wet. You win.</span></div></div>';
    h += '<ol><li><span><b>Tap a tile to turn it</b> a quarter turn clockwise.</span></li><li><span><b>Join the pipes</b> end to end. Water only passes where two openings meet.</span></li><li><span><b>Stuck?</b> A hint turns the next wrong tile and fixes it in place.</span></li></ol>';
    h += '<div class="foot3"><p>Daily: same board for everyone. Endless: three sizes.</p><button type="button" class="btn" id="howGo">Got it</button></div>';
    return h;
  }
  function openHow() {
    var d = demo(), st = document.createElement('style'); st.id = 'demoCss'; st.textContent = d.css; document.head.appendChild(st);
    $('how').innerHTML = howHtml(d); $('ov').hidden = false; store.seen = true; save(); $('howGo').addEventListener('click', closeHow); $('howGo').focus({ preventScroll: true });
  }
  function closeHow() {
    var ov = $('ov');
    function fin() { ov.hidden = true; $('how').innerHTML = ''; var s = $('demoCss'); if (s) s.remove(); try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) {} }
    var a = anim(ov, [{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: 'ease-out', fill: 'forwards' });
    if (a) a.onfinish = function () { a.cancel(); fin(); }; else fin();
  }
  $('helpBtn').addEventListener('click', openHow);
  $('ov').addEventListener('click', function (e) { if (e.target === $('ov')) closeHow(); });

  /* ---------- clock ---------- */
  function tick() {
    var now = new Date(), k = dateKey(now);
    if (k !== todayKey) { todayKey = k; dayNo = dayNumber(k); store.d = null; save(); if (S.mode === 'daily') init('daily'); return; }
    if (timerOn) $('clock').textContent = fmtTime(elapsed());
    var el = $('nextin'); if (!el) return;
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1), s = Math.max(0, Math.floor((next - now) / 1000)), p = function (n) { return String(n).padStart(2, '0'); };
    el.textContent = 'Next board in ' + p(Math.floor(s / 3600)) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60);
  }
  setInterval(tick, 500);

  var h0 = location.hash.replace('#', '');
  init(h0 === 'endless' ? 'endless' : 'daily');
  if (!store.seen) setTimeout(function () { if (!store.seen) openHow(); }, 350);
})();
</script>
