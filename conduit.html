<style>
/* Layout: the wall of a boiler room, riveted iron plates with dark seams. A brass nameplate hangs at the top with
   a little steam pipe on it. The board is a riveted iron panel; every tile is a small plate holding a length of
   copper pipe with brass flanges. Tap a tile to give it a quarter turn. Pipes that water has reached glow blue
   inside, and the blue runs outward from the brass valve wheel one tile at a time. A pressure gauge on the side
   climbs as more tiles get wet. Under the board a short line says how many are still dry. */
:root {
  --iron: #2f363b; --plate: #3d454c; --copper: #cb7a4b; --copperD: #6e3a20; --brass: #dcb35a; --water: #55cfec; --paper: #efe7d4; --ink: #22272b; --text: #e8edef; --muted: #a9b4ba;
  --head: 'Oswald', 'Arial Narrow', 'Helvetica Neue', sans-serif; --body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1); --grain: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--iron); }
body {
  margin: 0; min-height: 100dvh; color: var(--text); font: 500 17px/1.45 var(--body); position: relative; overflow-x: clip;
  background:
    var(--grain),
    radial-gradient(circle at center, #8a939a 0 2.4px, #14181b 3.6px, transparent 4.6px) 20px 208px / 44px 232px repeat-x,
    repeating-linear-gradient(0deg, transparent 0 228px, #12161a 228px 232px, rgba(255, 255, 255, 0.09) 232px 234px),
    radial-gradient(90% 55% at 50% 0%, rgba(255, 255, 255, 0.12), transparent 70%),
    radial-gradient(120% 100% at 50% 40%, transparent 50%, rgba(0, 0, 0, 0.45)),
    var(--iron);
  padding-block: 0 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p, ol { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }
.wrap { position: relative; max-width: 1120px; margin: 0 auto; }

/* ---------- top ---------- */
.top { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 24px; padding: 34px 0 20px; }
.plate { position: relative; margin-top: 0; padding: 22px 36px 14px; text-align: center; color: #3b2a08; border-radius: 0 0 10px 10px;
  background:
    radial-gradient(circle at center, #6d5320 0 2px, #f6e3a4 3px, transparent 4px) 8px 8px / 10px 10px no-repeat,
    radial-gradient(circle at center, #6d5320 0 2px, #f6e3a4 3px, transparent 4px) calc(100% - 8px) 8px / 10px 10px no-repeat,
    var(--grain), linear-gradient(180deg, #ecd088, #cba04b 55%, #b98a38);
  box-shadow: inset 0 0 0 2px rgba(80, 50, 5, 0.45), inset 0 2px 0 rgba(255, 245, 200, 0.6), 0 14px 20px -8px rgba(0, 0, 0, 0.75); }
.plate h1 { font: 700 clamp(2rem, 5vw, 2.7rem)/1 var(--head); letter-spacing: 0.14em; text-transform: uppercase; text-shadow: 0 1px 0 rgba(255, 245, 200, 0.7), 0 -1px 0 rgba(80, 50, 5, 0.5); }
.plate p { font: 600 0.74rem/1.2 var(--body); letter-spacing: 0.16em; text-transform: uppercase; margin-top: 6px; opacity: 0.8; }
.stack { position: absolute; right: 26px; top: -22px; width: 18px; height: 26px; background: linear-gradient(90deg, #9c5a33, var(--copper) 45%, #a86238); border-radius: 3px 3px 0 0; box-shadow: inset 0 0 0 1px rgba(60, 25, 5, 0.5); }
.stack::before { content: ""; position: absolute; left: -3px; right: -3px; top: 0; height: 6px; background: linear-gradient(180deg, #f1d58e, #b98a38); border-radius: 2px; }
.puff { position: absolute; left: 50%; top: -4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: rgba(240, 244, 246, 0.8); filter: blur(1.5px); opacity: 0; animation: puff 3.6s ease-out infinite; }
.puff:nth-child(2) { animation-delay: 1.2s; } .puff:nth-child(3) { animation-delay: 2.4s; }
@keyframes puff { 0% { opacity: 0; transform: translate(0, 0) scale(0.5); } 15% { opacity: 0.85; } 100% { opacity: 0; transform: translate(14px, -50px) scale(2.2); } }
.tools { display: flex; align-items: center; gap: 12px; margin-left: auto; flex-wrap: wrap; }
.tabs, .sizes { display: flex; padding: 4px; border-radius: 999px; background: rgba(15, 20, 23, 0.55); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.18); }
.tabs button, .sizes button { cursor: pointer; padding: 9px 18px; border: 0; border-radius: 999px; font: 700 0.92rem/1 var(--body); background: transparent; color: var(--muted); transition: background 0.35s var(--ease), color 0.35s; }
.sizes button { padding: 9px 13px; }
.tabs button[aria-pressed="true"], .sizes button[aria-pressed="true"] { background: var(--brass); color: #2a1e06; }
.help { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font: 700 1.1rem/1 var(--head); color: #2a1e06; background: var(--brass); border: 0; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5); transition: transform 0.35s var(--ease); }
.help:hover { transform: rotate(10deg) scale(1.1); }

// Conduit rules. No DOM in here.
// A board is a grid of pipe tiles. Each tile has openings on some of its four sides (N=1, E=2, S=4, W=8).
// Turning a tile a quarter turn clockwise moves every opening one side round. Water flows from the valve
// tile through any two touching openings. The board is solved when water reaches every tile.

const EPOCH = '2026-11-09';
const N = 1, E = 2, S = 4, W = 8;
const DIRS = [[0, -1, N, S], [1, 0, E, W], [0, 1, S, N], [-1, 0, W, E]];

  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
function dateKey(d) {

}

function rot(mask, r) { r = ((r % 4) + 4) % 4; for (let i = 0; i < r; i++) mask = ((mask << 1) | (mask >> 3)) & 15; return mask; }
function canonOf(mask) { let best = 99; for (let r = 0; r < 4; r++) best = Math.min(best, rot(mask, r)); return best; }

  return (mask === 5 || mask === 10) ? 'straight' : 'elbow';

// Grow one branching pipe from the valve until it reaches every cell, then turn each tile to a random side.
function makePuzzle(seedStr, cols, rows) {
  const n = cols * rows, rnd = mulberry32(hashStr('conduit/' + seedStr + '/' + cols + 'x' + rows));
  const pick = (len) => Math.min(len - 1, Math.floor(rnd() * len));
  const src = Math.floor(rows / 2 - 0.5 + rnd() * 2) * cols + Math.floor(cols / 2 - 0.5 + rnd() * 2);

  inTree[src] = true; order.push(src);

  const addEdges = (u) => { const x = u % cols, y = (u / cols) | 0; for (let d = 0; d < 4; d++) { const nx = x + DIRS[d][0], ny = y + DIRS[d][1]; if (nx >= 0 && ny >= 0 && nx < cols && ny < rows && !inTree[ny * cols + nx]) edges.push([u, ny * cols + nx, d]); } };
  addEdges(src);
  while (order.length < n) {
    edges = edges.filter((e) => !inTree[e[1]]);
    let pool = edges.filter((e) => deg[e[0]] < 3); if (!pool.length) pool = edges;
    // lean on the newest edges so pipes run in long snakes, not a star
    const e = rnd() < 0.55 ? pool[pool.length - 1 - Math.min(pool.length - 1, Math.floor(rnd() * 3))] : pool[pick(pool.length)];
    const [u, v, d] = e;
    solved[u] |= DIRS[d][2]; solved[v] |= DIRS[d][3]; deg[u]++; deg[v]++; inTree[v] = true; parent[v] = u; order.push(v); addEdges(v);
  }
  const canon = solved.map(canonOf), start = canon.map(() => Math.floor(rnd() * 4));
  const puz = { cols, rows, n, src, solved, canon, order, parent, start };
  // never hand out a board that is already finished
  for (let i = 0; isSolved(puz, start) && i < n; i++) start[i] = (start[i] + 1) % 4;
  return puz;
}
function maskAt(puz, i, r) { return rot(puz.canon[i], r); }
function fits(puz, i, r) { return maskAt(puz, i, r) === puz.solved[i]; }
// dist[i] is how many pipes the water has passed through to reach tile i, or -1 while it is dry
function flow(puz, rots) {
  const { cols, rows, n } = puz, dist = new Array(n).fill(-1), q = [puz.src];
  dist[puz.src] = 0;
  for (let h = 0; h < q.length; h++) {
    const u = q[h], x = u % cols, y = (u / cols) | 0, mu = maskAt(puz, u, rots[u]);
    for (let d = 0; d < 4; d++) {
      if (!(mu & DIRS[d][2])) continue;
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1]; if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
      const v = ny * cols + nx; if (dist[v] >= 0) continue;
      if (maskAt(puz, v, rots[v]) & DIRS[d][3]) { dist[v] = dist[u] + 1; q.push(v); }
    }
  }

}
function wetCount(dist) { let c = 0; for (let i = 0; i < dist.length; i++) if (dist[i] >= 0) c++; return c; }
function isSolved(puz, rots) { return wetCount(flow(puz, rots)) === puz.n; }
// The wrong tile that sits nearest the valve along the real pipe, and how many turns it needs.
function hintMove(puz, rots, locked) {
  for (let k = 0; k < puz.order.length; k++) {
    const i = puz.order[k];
    if (locked && locked[i]) continue;
    if (fits(puz, i, rots[i])) continue;
    for (let t = 1; t <= 3; t++) if (fits(puz, i, rots[i] + t)) return { i, turns: t };
  }
  return null;
}
function shareText(no, mode, ms, turns, hints, cols, rows) {
  return 'CONDUIT ' + (mode === 'daily' ? 'No. ' + no : 'Endless') + '  ' + cols + '×' + rows + '  ' + fmtTime(ms) + ' · ' + turns + ' turns · ' + (hints ? hints + (hints === 1 ? ' hint' : ' hints') : 'no hints');
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { EPOCH, N, E, S, W, DIRS, hashStr, mulberry32, dateKey, dayNumber, fmtTime, rot, canonOf, kindOf, makePuzzle, maskAt, fits, flow, wetCount, isSolved, hintMove, shareText };
}

  }

  /* ---------- saved ---------- */
  function clean(s) { s = s || {}; return { played: +s.played || 0, won: +s.won || 0, streak: +s.streak || 0, best: +s.best || 0, lastWin: +s.lastWin || 0 }; }
  function load() {
    var o = null;
    try { var r = localStorage.getItem(KEY); if (r) o = JSON.parse(r); } catch (e) { o = null; }
    o = (o && typeof o === 'object') ? o : {};
    return { seen: !!o.seen, es: [0, 1, 2].indexOf(+o.es) >= 0 ? +o.es : 1, sd: clean(o.sd), se: clean(o.se), d: o.d || null, e: o.e || null };
  }
  var store = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  function newSeed() { return 'r' + Math.random().toString(36).slice(2, 9); }

  /* ---------- state ---------- */
  var S = { mode: 'daily', z: 1, seed: '', puz: null, rots: [], deg: [], lock: {}, turns: 0, ms: 0, t0: 0, hints: 0, done: false, won: false, gaveUp: false };
  var timerOn = false, giveTimer = 0, tiles = [], prevWet = [], needleTo = -120;
  function rec() { return S.mode === 'daily' ? store.d : store.e; }
  function stats() { return S.mode === 'daily' ? store.sd : store.se; }
  function elapsed() { return S.ms + (timerOn ? Date.now() - S.t0 : 0); }
  function startClock() { if (!timerOn && !S.done) { S.t0 = Date.now(); timerOn = true; } }
  function stopClock() { if (timerOn) { S.ms += Date.now() - S.t0; timerOn = false; } }
  function save1() { var r = rec(); if (!r) return; r.rots = S.rots; r.lk = Object.keys(S.lock).map(Number); r.turns = S.turns; r.ms = elapsed(); r.hints = S.hints; r.done = S.done; r.won = S.won; r.gu = S.gaveUp; save(); }

  /* ---------- drawing a pipe ---------- */
  var ARM = { 1: 'M50 50V0', 2: 'M50 50H100', 4: 'M50 50V100', 8: 'M50 50H0' };
  var FLG = { 1: '<rect class="fl" x="32" y="0" width="36" height="8" rx="2"/>', 2: '<rect class="fl" x="92" y="32" width="8" height="36" rx="2"/>', 4: '<rect class="fl" x="32" y="92" width="36" height="8" rx="2"/>', 8: '<rect class="fl" x="0" y="32" width="8" height="36" rx="2"/>' };
  function pipeSvg(m) {
    var d = '', f = '', c = 0, b;
    for (b = 1; b <= 8; b <<= 1) if (m & b) { d += ARM[b]; f += FLG[b]; c++; }
    return '<svg class="pipe" viewBox="0 0 100 100" aria-hidden="true"><path class="po" d="' + d + '"/><path class="pb" d="' + d + '"/><path class="pw" d="' + d + '"/><path class="ph" d="' + d + '"/>' +
      '<circle class="hub" cx="50" cy="50" r="' + (c === 1 ? 15 : 14) + '"/><circle class="hw" cx="50" cy="50" r="7"/>' + f + (c === 1 ? '<circle class="rv" cx="50" cy="50" r="3"/>' : '') + '</svg>';
  }
  var VALVE = '<svg class="valve" viewBox="0 0 100 100" aria-hidden="true"><g class="wheel"><circle cx="50" cy="50" r="40" fill="none" stroke="#7a5a1c" stroke-width="12"/><circle cx="50" cy="50" r="40" fill="none" stroke="#dcb35a" stroke-width="8"/><path d="M50 12V88M12 50H88M23 23L77 77M77 23L23 77" stroke="#7a5a1c" stroke-width="7" stroke-linecap="round"/><path d="M50 12V88M12 50H88M23 23L77 77M77 23L23 77" stroke="#dcb35a" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="50" r="11" fill="#b98a38" stroke="#6d5320" stroke-width="3"/><circle cx="46" cy="46" r="3.5" fill="#f6e3a4"/></g></svg>';

  /* ---------- board ---------- */
  function build() {
    var p = S.puz, h = '';
    $('mount').style.setProperty('--cols', p.cols); $('mount').style.setProperty('--rows', p.rows);
    for (var i = 0; i < p.n; i++) h += '<button type="button" class="tile" role="gridcell" data-i="' + i + '">' + pipeSvg(p.canon[i]) + (i === p.src ? VALVE : '') + '</button>';
    $('grid').innerHTML = h; tiles = Array.prototype.slice.call($('grid').children);
    for (i = 0; i < p.n; i++) tiles[i].querySelector('.pipe').style.transform = 'rotate(' + S.deg[i] + 'deg)';
    prevWet = new Array(p.n).fill(false);
  }
  function paint() {
    var p = S.puz, dist = flow(p, S.rots), wet = wetCount(dist), i, fresh = 1e9;
    for (i = 0; i < p.n; i++) if (dist[i] >= 0 && !prevWet[i]) fresh = Math.min(fresh, dist[i]);
    for (i = 0; i < p.n; i++) {
      var t = tiles[i], on = dist[i] >= 0;
      t.style.setProperty('--d', on && !prevWet[i] ? ((dist[i] - fresh) * 0.055).toFixed(3) + 's' : '0s');
      t.classList.toggle('wet', on); t.classList.toggle('lock', !!S.lock[i]);
      t.setAttribute('aria-label', 'Row ' + (Math.floor(i / p.cols) + 1) + ', column ' + (i % p.cols + 1) + ', ' + (i === p.src ? 'valve, ' : '') + kindOf(p.solved[i]) + ', ' + (on ? 'wet' : 'dry') + (S.lock[i] ? ', fixed' : ''));
    }
    var grew = wet > prevWet.filter(Boolean).length;
    prevWet = dist.map(function (d) { return d >= 0; });
    $('wet').textContent = wet + '/' + p.n; $('tn').textContent = S.turns;
    $('hintn').innerHTML = S.hints ? '<b>' + S.hints + '</b> ' + (S.hints === 1 ? 'hint' : 'hints') : '';
    $('hint').disabled = S.done;
    var frac = wet / p.n, ang = -120 + 240 * Math.pow(frac, 1.4);
    if (wet <= 1) ang = -120 + 240 * 0.02;
    if (ang !== needleTo) { needleTo = ang; $('needle').style.transform = 'rotate(' + ang + 'deg)'; }
    $('gtxt').textContent = wet === p.n ? 'Full pressure' : Math.round(frac * 100) + '% wet';
    if (!S.done) {
      var c = $('coach');
      if (!S.turns && !S.hints) c.innerHTML = '<b>Join the pipes so water reaches every tile</b>Tap a tile to turn it. The water starts at the brass valve.';
      else c.innerHTML = '<b>' + (p.n - wet) + (p.n - wet === 1 ? ' tile' : ' tiles') + ' still dry</b>Water spreads from the valve through joined pipes.';
    }
    return { wet: wet, grew: grew, solved: wet === p.n };
  }
  function spin() { var w = tiles[S.puz.src].querySelector('.wheel'); if (w) anim(w, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 1100, fill: 'none' }); }
  function turn(i) {
    if (S.done) return;
    var t = tiles[i];
    if (S.lock[i]) { anim(t, [{ transform: 'translateX(-3px)' }, { transform: 'translateX(3px)' }, { transform: 'none' }], { duration: 240, fill: 'none' }); return; }
    startClock();
    S.rots[i] = (S.rots[i] + 1) % 4; S.deg[i] += 90; S.turns++;
    t.querySelector('.pipe').style.transform = 'rotate(' + S.deg[i] + 'deg)';
    var r = paint(); if (r.grew) spin();
    save1();
    if (r.solved) finish(true);
  }
  $('grid').addEventListener('click', function (e) { var t = e.target.closest('.tile'); if (t) turn(+t.getAttribute('data-i')); });
  $('grid').addEventListener('keydown', function (e) {
    var b = e.target.closest('.tile'); if (!b) return;
    var i = +b.getAttribute('data-i'), p = S.puz, d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowDown' ? p.cols : e.key === 'ArrowUp' ? -p.cols : 0;
    if (d) { e.preventDefault(); var j = i + d; if (j >= 0 && j < p.n && !(Math.abs(d) === 1 && Math.floor(j / p.cols) !== Math.floor(i / p.cols))) tiles[j].focus(); }
  });
  document.addEventListener('keydown', function (e) { if (!$('ov').hidden && e.key === 'Escape') closeHow(); });

  function hint() {
    if (S.done) return;
    var m = hintMove(S.puz, S.rots, S.lock); if (!m) return;
    startClock();
    S.rots[m.i] = (S.rots[m.i] + m.turns) % 4; S.deg[m.i] += 90 * m.turns; S.lock[m.i] = true; S.hints++;
    tiles[m.i].querySelector('.pipe').style.transform = 'rotate(' + S.deg[m.i] + 'deg)';
    var r = paint(); if (r.grew) spin();
    anim(tiles[m.i], [{ boxShadow: '0 0 0 3px #fff, 0 0 18px 6px rgba(255,255,255,.7)' }, { boxShadow: '0 0 0 0 transparent' }], { duration: 900, fill: 'none' });
    save1(); if (r.solved) finish(true);
  }
  function giveUp() {
    if (S.done) return; var b = $('giveup');
    if (b.getAttribute('data-sure') !== '1') { b.setAttribute('data-sure', '1'); b.textContent = 'Sure?'; clearTimeout(giveTimer); giveTimer = setTimeout(function () { b.removeAttribute('data-sure'); b.textContent = 'Show answer'; }, 3000); return; }
    solveAll(); S.gaveUp = true; paint(); finish(false);
  }
  function solveAll() {
    for (var i = 0; i < S.puz.n; i++) { var t; for (t = 0; t < 4; t++) if (fits(S.puz, i, S.rots[i] + t)) break; S.rots[i] = (S.rots[i] + t) % 4; S.deg[i] += 90 * t; if (tiles[i]) tiles[i].querySelector('.pipe').style.transform = 'rotate(' + S.deg[i] + 'deg)'; }
  }
  $('hint').addEventListener('click', hint); $('giveup').addEventListener('click', giveUp);

  /* ---------- finishing ---------- */
  function finish(won) {
    stopClock(); S.done = true; S.won = won;
    var st = stats(); st.played++;
    if (won) { st.won++; st.streak = (S.mode === 'daily') ? ((st.lastWin === dayNo - 1 || st.lastWin === dayNo) ? st.streak + 1 : 1) : st.streak + 1; if (S.mode === 'daily') st.lastWin = dayNo; if (!st.best || S.ms < st.best) st.best = S.ms; } else st.streak = 0;
    save1(); save(); paint(); $('acts').hidden = true; $('clock').textContent = fmtTime(S.ms);
    $('coach').innerHTML = won ? '<b>Water everywhere</b>' + (S.hints ? 'Done with ' + S.hints + (S.hints === 1 ? ' hint.' : ' hints.') : 'Done without a single hint.') : '<b>This is how it joins up</b>Every tile is wet.';
    var dist = flow(S.puz, S.rots);
    tiles.forEach(function (t, i) { t.style.setProperty('--g', (Math.max(0, dist[i]) * 0.06 + 0.4).toFixed(2) + 's'); });
    $('mount').classList.add('won'); spin();
    setTimeout(function () { showSlip(false); renderRecord(); }, reduce ? 0 : 2000);
  }
  function showSlip(instant) {
    var sl = $('slip'), txt = shareText(dayNo, S.mode, S.ms, S.turns, S.hints, S.puz.cols, S.puz.rows);
    sl.innerHTML = '<h2>' + (S.won ? 'Full pressure' : 'Answer shown') + '</h2><p>' + (S.won ? 'All ' + S.puz.n + ' tiles are wet.' : 'You gave up on this one.') + '</p>' +
      '<div class="stats"><div><b>' + fmtTime(S.ms) + '</b><span>Time</span></div><div><b>' + S.turns + '</b><span>Turns</span></div><div><b>' + S.hints + '</b><span>Hints</span></div></div>' +
      '<div class="foot"><button type="button" class="btn" id="copy">Copy result</button>' + (S.mode === 'daily' ? '<button type="button" class="btn ghost" id="toEnd">Play endless</button>' : '<button type="button" class="btn dark" id="nextM">Next board</button><button type="button" class="btn ghost" id="toDaily">Back to daily</button>') + '</div>' + (S.mode === 'daily' ? '<p class="next" id="nextin"></p>' : '');
    sl.hidden = false;
    $('copy').addEventListener('click', function () { var b = this, done = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy result'; }, 1600); }; try { navigator.clipboard.writeText(txt).then(done, function () { fb(txt); done(); }); } catch (e) { fb(txt); done(); } });
    var a = $('toEnd'); if (a) a.addEventListener('click', function () { go('endless'); });
    var n = $('nextM'); if (n) n.addEventListener('click', function () { store.e = null; init('endless'); });
    var d = $('toDaily'); if (d) d.addEventListener('click', function () { go('daily'); });
    tick();
    if (!instant) { if (window.innerWidth <= 960 && !reduce) { try { sl.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {} } anim(sl, [{ opacity: 0, transform: 'translateY(18px) rotate(1deg)' }, { opacity: 1, transform: 'none' }], { duration: 700 }); }
  }
  function fb(t) { var a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(a); }
  function renderRecord() {
    var st = stats();
    $('recT').textContent = 'Record · ' + (S.mode === 'daily' ? 'Daily' : 'Endless');
    $('nums').innerHTML = '<div><b>' + st.won + '</b><span>Solved</span></div><div><b>' + st.streak + '</b><span>Streak</span></div><div><b>' + (st.best ? fmtTime(st.best) : '–') + '</b><span>Best time</span></div><div><b>' + st.played + '</b><span>Played</span></div>';
  }

  /* ---------- modes ---------- */
  function init(mode) {
    S.mode = mode; stopClock(); needleTo = 999;
    $('mDaily').setAttribute('aria-pressed', mode === 'daily'); $('mEndless').setAttribute('aria-pressed', mode === 'endless');
    $('sizes').hidden = mode !== 'endless';
    var r = rec();
    if (mode === 'daily') { if (!r || r.key !== todayKey) { store.d = r = { key: todayKey, rots: null, lk: [], turns: 0, ms: 0, hints: 0, done: false, won: false }; save(); } S.seed = todayKey; S.z = 1; }
    else { if (!r || !r.seed) { store.e = r = { seed: newSeed(), z: store.es, rots: null, lk: [], turns: 0, ms: 0, hints: 0, done: false, won: false }; save(); } S.seed = r.seed; S.z = r.z; }
    var bs = $('sizes').children; for (var z = 0; z < bs.length; z++) bs[z].setAttribute('aria-pressed', +bs[z].getAttribute('data-z') === S.z);
    var sz = mode === 'daily' ? DAILY : SIZES[S.z]; S.puz = makePuzzle(S.seed, sz[0], sz[1]);
    var a = r.rots; if (!(Array.isArray(a) && a.length === S.puz.n && a.every(function (x) { return x === 0 || x === 1 || x === 2 || x === 3; }))) a = S.puz.start.slice();
    S.rots = a.slice(); S.deg = S.rots.map(function (x) { return x * 90; }); S.lock = {}; (r.lk || []).forEach(function (i) { S.lock[i] = true; });
    S.turns = +r.turns || 0; S.ms = +r.ms || 0; S.hints = +r.hints || 0; S.done = !!r.done; S.won = !!r.won; S.gaveUp = !!r.gu; timerOn = false;
    if (S.done && !S.won) { for (var i = 0; i < S.puz.n; i++) { var t; for (t = 0; t < 4; t++) if (fits(S.puz, i, S.rots[i] + t)) break; S.rots[i] = (S.rots[i] + t) % 4; S.deg[i] = S.rots[i] * 90; } }
    $('sub').textContent = mode === 'daily' ? 'No. ' + dayNo + ' · ' + new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }) : 'Endless · ' + NAMES[S.z];
    var gb = $('giveup'); gb.removeAttribute('data-sure'); gb.textContent = 'Show answer';
    $('slip').hidden = true; $('acts').hidden = S.done; $('mount').classList.remove('won');
    build(); paint(); renderRecord(); $('clock').textContent = fmtTime(S.ms);
    if (S.done) { $('mount').classList.add('won'); tiles.forEach(function (t) { t.style.setProperty('--g', '0s'); t.style.animation = 'none'; }); $('coach').innerHTML = S.won ? '<b>Water everywhere</b>' + (S.hints ? 'Done with ' + S.hints + (S.hints === 1 ? ' hint.' : ' hints.') : 'Done without a single hint.') : '<b>This is how it joins up</b>Every tile is wet.'; showSlip(true); }
    else tiles.forEach(function (t, i) { var x = i % S.puz.cols, y = Math.floor(i / S.puz.cols); anim(t, [{ opacity: 0, transform: 'scale(0.6) rotate(-8deg)' }, { opacity: 1, transform: 'none' }], { duration: 560, delay: 60 + (x + y) * 38 }); });
    anim($('mount'), [{ opacity: 0 }, { opacity: 1 }], { duration: 400 });
  }
  function go(m) { init(m); try { location.hash = m; } catch (e) {} }
  window.addEventListener('hashchange', function () { var h = location.hash.replace('#', ''); if ((h === 'daily' || h === 'endless') && h !== S.mode) init(h); });
  $('mDaily').addEventListener('click', function () { go('daily'); }); $('mEndless').addEventListener('click', function () { go('endless'); });
  $('sizes').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; var z = +b.getAttribute('data-z'); if (z === S.z) return; store.es = z; store.e = null; init('endless'); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { if (timerOn) { stopClock(); save1(); } } else if (!S.done && S.turns) startClock(); });
  window.addEventListener('pagehide', function () { if (!S.done) { stopClock(); save1(); } });

  /* gauge ticks */
  (function () {
    var h = '', i;
    for (i = 0; i <= 10; i++) {
      var a = (-120 + i * 24) * Math.PI / 180, big = i % 5 === 0, r1 = big ? 52 : 57, r2 = 63;
      h += '<line x1="' + (80 + Math.sin(a) * r1).toFixed(1) + '" y1="' + (80 - Math.cos(a) * r1).toFixed(1) + '" x2="' + (80 + Math.sin(a) * r2).toFixed(1) + '" y2="' + (80 - Math.cos(a) * r2).toFixed(1) + '" stroke="' + (i >= 9 ? '#b3321c' : '#4a4338') + '" stroke-width="' + (big ? 2.5 : 1.5) + '" stroke-linecap="round"/>';
    }
    $('ticks').innerHTML = h;
  })();

  /* ---------- how to play ---------- */
  /* A 3x3 board on a loop. Three tiles are the wrong way round; each gets a tap, and the water follows. */
  var DEMO = [2, 14, 12, 6, 13, 5, 1, 1, 1];
  function demo() {
    var off = { 4: 270, 3: 270, 5: 90 }, tapAt = { 4: 20, 3: 36, 5: 50 }, wetAt = [3, 5, 7, 40, 26, 54, 43, 29, 57], css = '', h = '<div class="dgrid">', i;
    for (i = 0; i < 9; i++) {
      var a = off[i] || 0, T = tapAt[i], nm = 'dd' + i;
      if (T) {
        css += '@keyframes ' + nm + 'r{0%,' + T + '%{transform:rotate(' + a + 'deg)}' + (T + 5) + '%,97%{transform:rotate(' + (a + 90) + 'deg)}97.01%,100%{transform:rotate(' + a + 'deg)}}';
        css += '@keyframes ' + nm + 't{0%,' + (T - 2) + '%{opacity:0;transform:scale(.4)}' + T + '%{opacity:.95;transform:scale(.8)}' + (T + 6) + '%{opacity:0;transform:scale(1.5)}100%{opacity:0}}';
        css += '.' + nm + ' .pipe{animation:' + nm + 'r var(--loop) infinite;transition:none}.' + nm + ' .tap{animation:' + nm + 't var(--loop) infinite}';
      }
      css += '@keyframes ' + nm + 'w{0%,' + wetAt[i] + '%{opacity:0}' + (wetAt[i] + 3) + '%,97%{opacity:1}97.01%,100%{opacity:0}}';
      css += '.' + nm + ' .pw,.' + nm + ' .hw{animation:' + nm + 'w var(--loop) infinite;transition:none}';
      css += '@keyframes ' + nm + 'g{0%,' + (wetAt[i] + 2) + '%{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px #14181b}' + (wetAt[i] + 5) + '%,97%{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 16px rgba(85,207,236,.32),0 0 0 1px #14181b}97.01%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px #14181b}}.' + nm + '{animation:' + nm + 'g var(--loop) infinite;transition:none}';
      h += '<div class="tile ' + nm + '" style="cursor:default">' + pipeSvg(DEMO[i]).replace('<svg class="pipe"', '<svg class="pipe" style="transform:rotate(' + a + 'deg)"') + (i === 0 ? VALVE : '') + (T ? '<i class="tap"></i>' : '') + '</div>';
    }
    css += '.dgrid .tile.dd0 .wheel{animation:dspin var(--loop) linear infinite}@keyframes dspin{0%,3%{transform:rotate(0)}30%,100%{transform:rotate(360deg)}}';
    return { css: css, html: h + '</div>' };
  }
  function howHtml(d) {
    var h = '<h2 id="howT">How to play</h2><p class="lead">Water starts at the brass valve. Turn the pipes so it reaches every tile.</p><div class="demo">' + d.html + '<div class="dcap"><span>The pipes are twisted. Water flows out of the valve.</span><span>Tap a tile to turn it a quarter turn.</span><span>Keep joining pipes. Wet pipes glow blue.</span><span>Every tile is wet. You win.</span></div></div>';
    h += '<ol><li><span><b>Tap a tile to turn it</b> a quarter turn clockwise.</span></li><li><span><b>Join the pipes</b> end to end. Water only passes where two openings meet.</span></li><li><span><b>Stuck?</b> A hint turns the next wrong tile and fixes it in place.</span></li></ol>';
    h += '<div class="foot3"><p>Daily: same board for everyone. Endless: three sizes.</p><button type="button" class="btn" id="howGo">Got it</button></div>';
    return h;
  }
  function openHow() {
    var d = demo(), st = document.createElement('style'); st.id = 'demoCss'; st.textContent = d.css; document.head.appendChild(st);
    $('how').innerHTML = howHtml(d); $('ov').hidden = false; store.seen = true; save(); $('howGo').addEventListener('click', closeHow); $('howGo').focus({ preventScroll: true });
  }
  function closeHow() {
    var ov = $('ov');
    function fin() { ov.hidden = true; $('how').innerHTML = ''; var s = $('demoCss'); if (s) s.remove(); try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) {} }
    var a = anim(ov, [{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: 'ease-out', fill: 'forwards' });
    if (a) a.onfinish = function () { a.cancel(); fin(); }; else fin();
  }
  $('helpBtn').addEventListener('click', openHow);
  $('ov').addEventListener('click', function (e) { if (e.target === $('ov')) closeHow(); });

  /* ---------- clock ---------- */
  function tick() {
    var now = new Date(), k = dateKey(now);
    if (k !== todayKey) { todayKey = k; dayNo = dayNumber(k); store.d = null; save(); if (S.mode === 'daily') init('daily'); return; }
    if (timerOn) $('clock').textContent = fmtTime(elapsed());
    var el = $('nextin'); if (!el) return;
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1), s = Math.max(0, Math.floor((next - now) / 1000)), p = function (n) { return String(n).padStart(2, '0'); };
    el.textContent = 'Next board in ' + p(Math.floor(s / 3600)) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60);
  }
  setInterval(tick, 500);

  var h0 = location.hash.replace('#', '');
  init(h0 === 'endless' ? 'endless' : 'daily');
  if (!store.seen) setTimeout(function () { if (!store.seen) openHow(); }, 350);
})();
</script>
