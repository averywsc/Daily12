<style>
/* Layout: an embroidery sampler on linen. Left, the sampler itself: a hidden row under a cloth flap,
   then nine rows of four stitches, each with its knots beside it, and a needle that moves down to the
   row being worked. Right, a felt-lined sewing tray with six skeins, fabric-patch buttons, and a paper
   tag with the result. The title is stitched in cross-stitch. On a phone everything stacks. */
:root {
  --linen: #e7dcc5; --linen2: #f2e9d6; --ink: #3a2f27; --muted: #7d6e5c;
  --madder: #b5443a; --indigo: #36508c; --felt: #2f4a45; --felt2: #243b37; --gilt: #d9b24c;
  --serif: 'Lora', Georgia, 'Times New Roman', serif; --sans: 'Josefin Sans', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --grain: none; --band: none;
  --rh: clamp(40px, calc((100dvh - 300px) / 9), 62px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--linen); }
body {
  margin: 0; min-height: 100dvh; color: var(--ink); font: 400 17px/1.45 var(--serif); position: relative; overflow-x: clip;
  background-color: var(--linen);
  background-image:
    var(--grain),
    repeating-linear-gradient(0deg, rgba(120, 92, 52, 0.11) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(120, 92, 52, 0.11) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(0deg, transparent 0 41px, rgba(255, 255, 255, 0.22) 41px 43px, transparent 43px 97px),
    repeating-linear-gradient(90deg, transparent 0 53px, rgba(255, 255, 255, 0.18) 53px 54px, transparent 54px 131px),
    radial-gradient(90% 70% at 50% 30%, transparent 55%, rgba(110, 80, 40, 0.22) 100%);
  padding-block: 0 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { /* tea ring, pinholes and a pressed fold */
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(circle at 91% 86%, transparent 0 46px, rgba(150, 100, 45, 0.16) 47px 50px, transparent 53px),
    radial-gradient(circle at 91% 86%, rgba(150, 100, 45, 0.07) 0, transparent 46px),
    linear-gradient(90deg, transparent calc(50% - 1px), rgba(90, 65, 30, 0.07) 50%, rgba(255, 255, 255, 0.35) calc(50% + 1px), transparent calc(50% + 3px));
}
h1, h2, h3, p, ol, dl, dd { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; border-radius: 6px; }
.lint { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.lint i { position: absolute; width: 14px; height: 6px; border-top: 1px solid rgba(255, 255, 255, 0.8); border-radius: 50%; opacity: 0; animation: lint var(--t) ease-in-out var(--d) infinite; }
@keyframes lint { 0% { opacity: 0; transform: translate(0, 0) rotate(var(--r)); } 15% { opacity: 0.8; } 85% { opacity: 0.7; } 100% { opacity: 0; transform: translate(var(--x), -150px) rotate(calc(var(--r) + 140deg)); } }

/* ---------- band and header ---------- */
.band { position: relative; z-index: 1; height: 26px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); background: var(--band) center / 36px 26px repeat-x, rgba(54, 80, 140, 0.1); border-bottom: 1px solid rgba(54, 80, 140, 0.35); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5); }
.wrap { position: relative; z-index: 1; max-width: 1480px; margin: 0 auto; }
.top { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; padding: 16px 0 14px; }
.logo { display: block; width: clamp(180px, 26vw, 250px); height: auto; overflow: visible; }
.logo .x { stroke-linecap: round; fill: none; stroke-dasharray: 1; stroke-dashoffset: 1; animation: sew 0.5s var(--ease) forwards; animation-delay: calc(var(--i) * 11ms + 150ms); }
@keyframes sew { to { stroke-dashoffset: 0; } }
.sub { font: italic 400 0.95rem/1.2 var(--serif); color: var(--muted); margin-top: 6px; }
.tools { display: flex; align-items: center; gap: 12px; }
.tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: rgba(255, 255, 255, 0.35); border: 1px dashed rgba(54, 80, 140, 0.55); border-radius: 999px; padding: 3px; outline: 1px solid rgba(54, 80, 140, 0.12); outline-offset: 2px; }
.tabs button { position: relative; z-index: 1; background: none; border: 0; cursor: pointer; padding: 8px 18px; font: 600 0.82rem/1 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); transition: color 0.5s; }
.tabs button[aria-pressed="true"] { color: #fbf4e4; }
.tabs .pill { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 999px; background: var(--indigo); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25) inset; transition: transform 0.7s var(--ease); }
.tabs[data-m="endless"] .pill { transform: translateX(100%); }
.help { width: 36px; height: 36px; border-radius: 50%; border: 1px dashed var(--madder); background: rgba(255, 255, 255, 0.35); color: var(--madder); cursor: pointer; font: italic 600 1.1rem/1 var(--serif); transition: background 0.3s, transform 0.4s var(--ease); }
.help:hover { background: rgba(181, 68, 58, 0.12); transform: rotate(-8deg) scale(1.06); }

/* ---------- layout ---------- */
.work { display: grid; grid-template-columns: minmax(340px, 1.05fr) minmax(320px, 1fr); gap: clamp(22px, 4vw, 70px); align-items: start; }

/* ---------- the sampler ---------- */
.sampler {
  position: relative; padding: 14px clamp(14px, 3vw, 34px) 18px; border-radius: 6px; perspective: 900px;
  background: var(--grain), repeating-linear-gradient(0deg, rgba(120, 92, 52, 0.08) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(120, 92, 52, 0.08) 0 1px, transparent 1px 3px), var(--linen2);
  box-shadow: 0 0 0 7px #3b5590, 0 0 0 8px rgba(255, 255, 255, 0.35), 0 16px 30px -10px rgba(60, 40, 15, 0.55), 0 2px 0 8px #2b4176;
}
.sampler::before { content: ""; position: absolute; inset: 6px; border: 2px dashed rgba(181, 68, 58, 0.7); border-radius: 3px; pointer-events: none; }
.sampler::after { content: ""; position: absolute; inset: -8px; border-radius: 12px; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12); }
.hid { position: relative; margin: 6px 0 10px 34px; padding: 6px 0 8px; }
.hid .cap { font: 600 0.7rem/1 var(--sans); letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.flap { z-index: 6;
  position: absolute; left: -6px; right: -6px; top: 0; bottom: 0; transform-origin: top center; backface-visibility: hidden;
  background: var(--grain), repeating-linear-gradient(0deg, rgba(120, 92, 52, 0.1) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(120, 92, 52, 0.1) 0 1px, transparent 1px 3px), #d9cbae;
  border-radius: 4px; box-shadow: 0 6px 10px -4px rgba(60, 40, 15, 0.55); display: grid; place-items: center;
  transition: transform 1s var(--ease), opacity 0.4s ease 0.7s;
}
.flap::before { content: ""; position: absolute; inset: 4px; border: 1.5px dashed rgba(54, 80, 140, 0.6); border-radius: 3px; }
.flap span { position: relative; font: italic 500 1rem/1 var(--serif); color: #5b4a38; letter-spacing: 0.04em; }
.hid.open .flap { z-index: 6; transform: rotateX(-120deg); opacity: 0; pointer-events: none; }
.hid .slots .st { cursor: default; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0 0 10px 34px; font: 600 0.8rem/1.2 var(--sans); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.rows { position: relative; list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.row { display: grid; grid-template-columns: 34px auto 1fr; align-items: center; height: var(--rh); border-radius: 6px; transition: background 0.5s; }
.row .n { font: italic 500 0.95rem/1 var(--serif); color: var(--muted); text-align: center; }
.row.on { background: linear-gradient(90deg, rgba(54, 80, 140, 0.1), rgba(54, 80, 140, 0)); }
.row.on .n { color: var(--indigo); font-weight: 600; }
.slots { display: flex; gap: clamp(6px, 1.4vw, 12px); }
.st {
  --c: transparent; --c2: transparent;
  position: relative; width: calc(var(--rh) - 8px); height: calc(var(--rh) - 8px); border: 0; padding: 0; border-radius: 7px; cursor: pointer; color: rgba(255, 255, 255, 0.88);
  background:
    radial-gradient(circle at 3px 3px, rgba(110, 85, 50, 0.55) 1px, transparent 1.6px) 0 0 / 100% 100% no-repeat,
    radial-gradient(circle at calc(100% - 3px) 3px, rgba(110, 85, 50, 0.55) 1px, transparent 1.6px) 0 0 / 100% 100% no-repeat,
    radial-gradient(circle at 3px calc(100% - 3px), rgba(110, 85, 50, 0.55) 1px, transparent 1.6px) 0 0 / 100% 100% no-repeat,
    radial-gradient(circle at calc(100% - 3px) calc(100% - 3px), rgba(110, 85, 50, 0.55) 1px, transparent 1.6px) 0 0 / 100% 100% no-repeat,
    rgba(120, 92, 52, 0.08);
  box-shadow: inset 0 0 0 1px rgba(120, 92, 52, 0.28);
  transition: transform 0.4s var(--ease);
}
.st.f { background: repeating-linear-gradient(58deg, var(--c) 0 3px, var(--c2) 3px 4px); box-shadow: 0 2px 3px rgba(40, 25, 8, 0.4), inset 0 0 0 1px rgba(0, 0, 0, 0.12); }
.st.f::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(135deg, rgba(255, 255, 255, 0.34), transparent 45%, rgba(0, 0, 0, 0.22)); pointer-events: none; }
.st svg { position: absolute; inset: 22%; width: 56%; height: 56%; z-index: 1; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-dasharray: 2.4 1.7; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.3)); }
.st svg .fl { fill: currentColor; stroke: none; }
.row.on .st:not(.f):hover { transform: scale(1.06); }
.row:not(.on) .st { cursor: default; }
[data-c="0"] { --c: #b5443a; --c2: #8c2f28; } [data-c="1"] { --c: #36508c; --c2: #263b6b; } [data-c="2"] { --c: #dca62c; --c2: #b3801a; }
[data-c="3"] { --c: #5c8a4a; --c2: #416a33; } [data-c="4"] { --c: #7b4a80; --c2: #5a3360; } [data-c="5"] { --c: #3a3633; --c2: #14110f; }
.knots { display: grid; grid-template-columns: repeat(2, 15px); gap: 5px; justify-self: end; margin-right: clamp(4px, 2vw, 18px); }
.kn { width: 15px; height: 15px; border-radius: 50%; background: rgba(120, 92, 52, 0.16); box-shadow: inset 0 1px 2px rgba(60, 40, 15, 0.45); }
.kn.g { background: radial-gradient(circle at 35% 30%, #fff1b3, var(--gilt) 45%, #8f6c18 100%); box-shadow: 0 1.5px 2px rgba(40, 25, 8, 0.55), inset 0 0 0 1px rgba(110, 80, 10, 0.5); }

<script>
// Sampler rules. No DOM in here, so the same file runs in the page and in node.

const EPOCH = '2026-11-09';
const THREADS = 6;   // colours to choose from
const WIDTH = 4;     // stitches in a row
const ROWS = 9;      // rows on the cloth

function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function dateKey(d) {
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function dayNumber(key) {
  const [y, m, d] = key.split('-').map(Number);
  const [ey, em, ed] = EPOCH.split('-').map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(ey, em - 1, ed)) / 86400000) + 1;
}

// The hidden row. Colours may repeat, but never fill all four places with one colour.
function makeSecret(seedStr) {
  const rnd = mulberry32(hashStr('sampler/' + seedStr));
  for (;;) {
    const s = [];
    for (let i = 0; i < WIDTH; i++) s.push(Math.floor(rnd() * THREADS));
    if (new Set(s).size >= 2) return s;
  }
}

// Returns { exact, near }: exact = right thread in the right place, near = right thread, wrong place.
function score(secret, guess) {
  let exact = 0;
  const sc = new Array(THREADS).fill(0), gc = new Array(THREADS).fill(0);
  for (let i = 0; i < WIDTH; i++) {
    if (secret[i] === guess[i]) exact++;
    else { sc[secret[i]]++; gc[guess[i]]++; }
  }
  let near = 0;
  for (let c = 0; c < THREADS; c++) near += Math.min(sc[c], gc[c]);
  return { exact, near };
}

function shareText(no, mode, rows, won) {
  const head = 'SAMPLER ' + (mode === 'daily' ? 'No. ' + no : 'Endless') + '  ' + (won ? rows.length : 'X') + '/' + ROWS;
  const lines = rows.map((r) => '●'.repeat(r.e) + '○'.repeat(r.n) + '·'.repeat(WIDTH - r.e - r.n));
  return head + '\n' + lines.join('\n');
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { EPOCH, THREADS, WIDTH, ROWS, hashStr, mulberry32, dateKey, dayNumber, makeSecret, score, shareText };
}

        n += 2;
      }
    }

  })();
  /* fibres drifting in the light */

    $('lint').innerHTML = h;
  })();

  function anim(el, kf, o) {

  }

  /* ---------- saved ---------- */
  function clean(s) {

    return { played: +s.played || 0, won: +s.won || 0, streak: +s.streak || 0, best: +s.best || 0, lastWin: +s.lastWin || 0, dist: d };
  }
  function load() {
    var o = null;
    try { var r = localStorage.getItem(KEY); if (r) o = JSON.parse(r); } catch (e) { o = null; }

  }
  var store = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  function newSeed() { return 'r' + Math.random().toString(36).slice(2, 9); }

  /* ---------- state ---------- */
  var S = { mode: 'daily', secret: null, rows: [], cur: [null, null, null, null], done: false, won: false, busy: false };
  var needleTimer = 0, tagTimer = 0;
  function rnd() { return S.mode === 'daily' ? store.d : store.e; }
  function stats() { return S.mode === 'daily' ? store.sd : store.se; }

  /* ---------- build ---------- */
  function buildBoard() {
    var h = '<svg class="needle" id="needle" viewBox="0 0 54 14" aria-hidden="true"><path class="th" d="M0 8 C6 2 10 12 16 7 S 24 6 28 7"/><path d="M24 7 L52 7 L24 5.6 Z" fill="#cfd3d6" stroke="#8d949a" stroke-width="0.6"/><ellipse cx="29" cy="6.3" rx="2.4" ry="0.9" fill="#f2e9d6" stroke="#8d949a" stroke-width="0.5"/></svg>';
    for (var i = 0; i < ROWS; i++) {
      h += '<li class="row" data-i="' + i + '"><span class="n">' + (i + 1) + '</span><div class="slots">';
      for (var j = 0; j < WIDTH; j++) h += '<button type="button" class="st" data-j="' + j + '" tabindex="-1"></button>';
      h += '</div><div class="knots"><i class="kn"></i><i class="kn"></i><i class="kn"></i><i class="kn"></i></div></li>';
    }
    $('rows').innerHTML = h;
    var hs = ''; for (var k = 0; k < WIDTH; k++) hs += '<span class="st"></span>';
    $('hslots').innerHTML = hs;
    var sk = '';
    for (var c = 0; c < THREADS; c++) sk += '<button type="button" class="sk" data-c="' + c + '" style="--rot:' + ((c * 37) % 7 - 3) + 'deg" aria-label="' + NAMES[c] + ' thread (key ' + (c + 1) + ')"><span class="wind"></span><span class="band2">' + glyph(c) + '<small>' + (c + 1) + '</small></span></button>';
    $('skeins').innerHTML = sk;
    $('skeins').addEventListener('click', function (e) { var b = e.target.closest('.sk'); if (b) pick(+b.getAttribute('data-c')); });
    $('rows').addEventListener('click', function (e) {
      var b = e.target.closest('.st'); if (!b) return;
      var r = b.closest('.row'); if (!r || +r.getAttribute('data-i') !== S.rows.length || S.done || S.busy) return;
      var j = +b.getAttribute('data-j'); if (S.cur[j] != null) { S.cur[j] = null; paint(); coach(); save1(); }
    });
  }
  function setSlot(el, c) {
    if (c == null) { el.className = 'st'; el.removeAttribute('data-c'); el.innerHTML = ''; el.setAttribute('aria-label', 'Empty stitch'); return; }
    el.className = 'st f'; el.setAttribute('data-c', c); el.innerHTML = glyph(c); el.setAttribute('aria-label', NAMES[c]);
  }
  function rowEl(i) { return $('rows').children[i + 1]; } /* child 0 is the needle */
  function paint() {
    for (var i = 0; i < ROWS; i++) {
      var li = rowEl(i), slots = li.querySelectorAll('.st'), kn = li.querySelectorAll('.kn');
      var committed = i < S.rows.length, active = i === S.rows.length && !S.done;
      li.classList.toggle('on', active);
      for (var j = 0; j < WIDTH; j++) setSlot(slots[j], committed ? S.rows[i].g[j] : (active ? S.cur[j] : null));
      for (var k = 0; k < 4; k++) kn[k].className = 'kn' + (committed ? (k < S.rows[i].e ? ' g' : (k < S.rows[i].e + S.rows[i].n ? ' o' : '')) : '');
      li.querySelector('.knots').setAttribute('aria-label', committed ? S.rows[i].e + ' gilt knots, ' + S.rows[i].n + ' rings' : '');
    }
    var hs = $('hslots').children; for (var q = 0; q < WIDTH; q++) setSlot(hs[q], S.secret[q]);
    $('hid').classList.toggle('open', S.done && !S.busy);
    var full = S.cur.every(function (v) { return v != null; });
    $('go').disabled = !full || S.done || S.busy;
    $('undo').disabled = S.done || S.busy || S.cur.every(function (v) { return v == null; });
    $('clear').disabled = $('undo').disabled;
    var sks = $('skeins').children; for (var s = 0; s < sks.length; s++) sks[s].disabled = S.done || S.busy;
    placeNeedle(false);
  }
  function placeNeedle(smooth) {
    var n = $('needle'); if (!n) return;
    var i = Math.min(S.rows.length, ROWS - 1), li = rowEl(i);
    n.style.transition = smooth && !reduce ? '' : 'none';
    n.style.transform = 'translateY(' + (li.offsetTop + li.offsetHeight / 2 - 7) + 'px)';
    n.style.opacity = S.done ? '0' : '1';
    if (!smooth) { void n.offsetWidth; n.style.transition = ''; }
  }
  window.addEventListener('resize', function () { placeNeedle(false); });

  function coach(msg) {
    var c = $('coach');
    if (msg) { c.innerHTML = '<b>' + msg[0] + '</b><span>' + msg[1] + '</span>'; return; }
    if (S.done) return;
    var n = S.cur.filter(function (v) { return v != null; }).length;
    if (n === 0) c.innerHTML = S.rows.length === 0 ? '<b>Pick 4 colours</b><span>Tap the colours below. You are guessing the hidden row at the top.</span>' : '<b>Guess ' + (S.rows.length + 1) + ' of ' + ROWS + '</b><span>Use the dots next to your last guess, then pick 4 colours.</span>';
    else if (n < 4) c.innerHTML = '<b>' + n + ' of 4 picked</b><span>Tap a picked colour in the row to remove it.</span>';
    else c.innerHTML = '<b>Ready</b><span>Press Check row.</span>';
  }

  /* ---------- play ---------- */
  function save1() { var r = rnd(); if (r) { r.rows = S.rows; r.cur = S.cur; r.done = S.done; r.won = S.won; save(); } }
  function pick(c) {

    var j = S.cur.indexOf(null); if (j < 0) return;

    anim(el, [{ clipPath: 'inset(0 100% 0 0)', transform: 'scale(0.9)' }, { clipPath: 'inset(0 0 0 0)', transform: 'scale(1)' }], { duration: 420 });
    var sk = $('skeins').children[c]; anim(sk, [{ transform: 'translateY(-10px) scale(1.06)' }, { transform: 'translateY(0) scale(1)' }], { duration: 380, fill: 'none' });
  }
  function undo() {

  }
  function clearRow() { if (S.done || S.busy) return; S.cur = [null, null, null, null]; paint(); coach(); save1(); }
  function submit() {

    var g = S.cur.slice(), sc = score(S.secret, g), i = S.rows.length;
    S.rows.push({ g: g, e: sc.exact, n: sc.near }); S.cur = [null, null, null, null];

      coach([wl.e + ' right spot, ' + wl.n + ' wrong spot', wl.e + wl.n === 0 ? 'None of these colours are in the hidden row.' : 'Gold dot: right colour in the right spot. Ring: right colour, wrong spot.']);
      var nl = rowEl(S.rows.length); anim(nl, [{ opacity: 0.4, transform: 'translateX(-8px)' }, { opacity: 1, transform: 'none' }], { duration: 500 });
    }, wait);
  }
  function paint2() { $('go').disabled = true; $('undo').disabled = true; $('clear').disabled = true; var s = $('skeins').children; for (var i = 0; i < s.length; i++) s[i].disabled = true; }

  function finish() {

      st.won++; st.dist[S.rows.length - 1]++;
      if (S.mode === 'daily') { st.streak = (st.lastWin === dayNo - 1 || st.lastWin === dayNo) ? st.streak + 1 : 1; st.lastWin = dayNo; st.best = Math.max(st.best, st.streak); }
      else { st.streak++; st.best = Math.max(st.best, st.streak); }

  }
  function revealEnd(instant) {
    var hid = $('hid');
    if (instant) { hid.classList.add('open'); showTag(true); renderRecord(); coach(S.won ? ['You got it', 'Found in ' + S.rows.length + (S.rows.length === 1 ? ' guess.' : ' guesses.')] : ['Out of guesses', 'The hidden row is shown at the top.']); return; }
    hid.classList.add('open');
    var sl = $('hslots').children;
    for (var k = 0; k < sl.length; k++) anim(sl[k], [{ transform: 'scale(0.7)', opacity: 0 }, { transform: 'scale(1.08)', opacity: 1, offset: 0.6 }, { transform: 'scale(1)', opacity: 1 }], { duration: 600, delay: 500 + k * 120 });
    if (S.won) { var li = rowEl(S.rows.length - 1).querySelectorAll('.st'); for (var j = 0; j < li.length; j++) anim(li[j], [{ transform: 'translateY(0)' }, { transform: 'translateY(-9px) rotate(-4deg)' }, { transform: 'translateY(0)' }], { duration: 600, delay: 300 + j * 90, fill: 'none' }); }
    coach(S.won ? ['You got it', 'Found in ' + S.rows.length + (S.rows.length === 1 ? ' guess.' : ' guesses.')] : ['Out of guesses', 'The hidden row is shown at the top.']);
    clearTimeout(tagTimer); tagTimer = setTimeout(function () { showTag(false); renderRecord(); }, reduce ? 0 : 1300);
  }
  function showTag(instant) {
    var tw = $('tagwrap'), won = S.won, r = S.rows;
    $('felt').hidden = true;
    var txt = shareText(dayNo, S.mode, r, won);
    var body = txt.split('\n').slice(1).join('\n');
    tw.innerHTML = '<div class="tag' + (won ? '' : ' lost') + '"><h2>' + (won ? (r.length === 1 ? 'First guess!' : 'Solved in ' + r.length) : 'Out of guesses') + '</h2>' +
      '<p>' + (won ? 'You found the hidden row in ' + r.length + ' of ' + ROWS + ' guesses.' : 'The hidden row is shown at the top.') + '</p><pre>' + body + '</pre>' +
      '<div class="foot"><button type="button" class="patch" id="copy">Copy result</button>' +
      (S.mode === 'daily' ? '<button type="button" class="patch paper" id="toEnd">Play endless</button>' : '<button type="button" class="patch hot" id="nextC">Next cloth</button><button type="button" class="patch paper" id="toDaily">Back to daily</button>') +
      '</div>' + (S.mode === 'daily' ? '<p class="next" id="nextin"></p>' : '') + '</div>';
    tw.hidden = false;
    $('copy').addEventListener('click', function () {
      var b = this; var done = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy result'; }, 1600); };

    });

    var nc = $('nextC'); if (nc) nc.addEventListener('click', function () { store.e = null; init('endless'); });
    var td = $('toDaily'); if (td) td.addEventListener('click', function () { go('daily'); });

    if (!instant && !reduce && window.innerWidth <= 880) { try { tw.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {} }
    if (!instant) anim(tw, [{ opacity: 0, transform: 'translateY(-12px) rotate(-5deg)' }, { opacity: 1, transform: 'translateY(2px) rotate(1.5deg)', offset: 0.65 }, { opacity: 1, transform: 'none' }], { duration: 1000 });
  }
  function fallbackCopy(t) { var a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(a); }

  function renderRecord() {
    var st = stats();

    $('nums').innerHTML = '<div><b>' + st.played + '</b><span>Played</span></div><div><b>' + (st.played ? Math.round(st.won / st.played * 100) : 0) + '%</b><span>Solved</span></div><div><b>' + st.streak + '</b><span>Streak</span></div><div><b>' + st.best + '</b><span>Best</span></div>';
    var mx = Math.max.apply(null, st.dist.concat([1])), h = '';
    for (var i = 0; i < ROWS; i++) h += '<div class="' + (S.done && S.won && S.rows.length === i + 1 ? 'me' : '') + '"><span>' + (i + 1) + '</span><i data-n="' + st.dist[i] + '" style="--w:' + Math.max(8, Math.round(st.dist[i] / mx * 100)) + '%"></i></div>';
    $('dist').innerHTML = h;
  }

  /* ---------- modes ---------- */
  function init(mode) {

    else { if (!r || !r.seed) { store.e = r = { seed: newSeed(), rows: [], cur: [null, null, null, null], done: false, won: false }; save(); } S.secret = makeSecret(r.seed); }
    S.rows = r.rows || []; S.cur = (r.cur && r.cur.length === WIDTH) ? r.cur : [null, null, null, null]; S.done = !!r.done; S.won = !!r.won;
    $('sub').textContent = mode === 'daily' ? 'No. ' + dayNo + ' · ' + new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }) : 'Endless · a fresh cloth every round';
    $('felt').hidden = S.done; $('tagwrap').hidden = true;
    $('hid').classList.remove('open');
    paint(); coach(); renderRecord();
    if (S.done) { revealEnd(true); $('felt').hidden = true; }
    var b = $('sampler'); void b;
    anim($('rows'), [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 600 });
    anim($('felt'), [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 650, delay: 120 });
    placeNeedle(false);
  }
  function go(m) { init(m); try { location.hash = m; } catch (e) {} }
  window.addEventListener('hashchange', function () { var h = location.hash.replace('#', ''); if ((h === 'daily' || h === 'endless') && h !== S.mode) init(h); });
  $('mDaily').addEventListener('click', function () { go('daily'); });
  $('mEndless').addEventListener('click', function () { go('endless'); });
  $('undo').addEventListener('click', undo); $('clear').addEventListener('click', clearRow); $('go').addEventListener('click', submit);
  document.addEventListener('keydown', function (e) {

    var t = e.target && e.target.tagName;

    else if (e.key === 'Backspace') { e.preventDefault(); undo(); }
    else if (e.key === 'Enter' && (t !== 'BUTTON' || (e.target.classList && (e.target.classList.contains('sk') || e.target.classList.contains('st'))))) { e.preventDefault(); submit(); }
  });

  /* ---------- how to play ---------- */
  function howHtml() {
    var secret = [0, 2, 4, 1], guess = [0, 1, 0, 2];
    var h = '<h2 id="howT">How to play</h2><p class="lead">Guess the hidden row of 4 colours in 9 tries.</p><div class="demo">';
    h += '<div class="hrow">' + secret.map(function (c) { return '<span class="st f" data-c="' + c + '">' + glyph(c) + '</span>'; }).join('') + '<span class="cover">hidden row</span></div>';
    h += '<div class="grow"><div class="slots">' + guess.map(function (c) { return '<span class="st f" data-c="' + c + '">' + glyph(c) + '</span>'; }).join('') + '</div><div class="knots"><i class="kn g"></i><i class="kn o"></i><i class="kn o"></i><i class="kn"></i></div></div>';
    h += '<div class="key"><span><i class="kn g"></i>right colour, right spot</span><span><i class="kn o"></i>right colour, wrong spot</span></div></div>';
    h += '<ol><li><span><b>Pick 4 colours.</b> Tap the colours at the bottom. You can use a colour more than once.</span></li>' +
      '<li><span><b>Press Check row.</b> Dots appear next to your guess and tell you how close you are.</span></li>' +

  }

    var a = anim(ov, [{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: 'ease-out', fill: 'forwards' });

  $('ov').addEventListener('click', function (e) { if (e.target === $('ov')) closeHow(); });

  /* ---------- clock ---------- */

    el.textContent = 'Next cloth in ' + p(Math.floor(s / 3600)) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60);
  }
  setInterval(tick, 1000);

  buildBoard();
  var h0 = location.hash.replace('#', '');
  init(h0 === 'endless' ? 'endless' : 'daily');
  if (!store.seen) setTimeout(function () { if (!store.seen) openHow(); }, 350);
})();
