<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Dispatch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&family=Reenie+Beanie&display=swap">
<style>
/* Layout: the desk of a telegraph office. Left, a yellowed blank telegram form with the coded message
   typed on it, each coded letter sitting over a pencil guess line. Right, a small desk: a brass nameplate,
   the mode tags, a strip of letter counts, a typewriter keyboard, a brass telegraph key that taps as you
   type, a clock, and the record. When the message is decoded a RECEIVED stamp comes down on the form.
   On a phone the form comes first and the desk stacks under it. */
:root {
  --walnut: #3b2417; --walnut2: #26160d; --paper: #e8d9a6; --paper2: #dcc98a; --ink: #2a2118; --pencil: #3d4258; --stamp: #b3342a;
  --brass: #c49a45; --brass-d: #7d5c1d; --key: #efe4c3; --marker: #f3dd6e;
  --type: 'Special Elite', 'Courier New', Courier, monospace; --small: 'Courier Prime', 'Courier New', Courier, monospace; --hand: 'Reenie Beanie', 'Segoe Print', 'Bradley Hand', cursive;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --grain: none; --cw: 25px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--walnut2); }
body {
  margin: 0; min-height: 100dvh; color: #efe4c3; font: 400 17px/1.45 var(--small); position: relative; overflow-x: clip;
  background:
    var(--grain),
    radial-gradient(70% 55% at 22% 0%, rgba(255, 190, 110, 0.28), transparent 70%),
    repeating-linear-gradient(91deg, rgba(0, 0, 0, 0.2) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(89deg, rgba(255, 220, 170, 0.045) 0 1px, transparent 1px 23px),
    radial-gradient(130% 100% at 50% 40%, transparent 50%, rgba(0, 0, 0, 0.55) 100%),
    linear-gradient(#412819, var(--walnut) 40%, var(--walnut2));
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p, ol { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid #ffd77a; outline-offset: 2px; }
.wrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; }
.shav { position: absolute; z-index: 0; pointer-events: none; width: 46px; height: 22px; border: 3px solid rgba(226, 190, 130, 0.5); border-bottom: 0; border-left-color: transparent; border-radius: 50% 50% 0 0; opacity: 0.55; }

/* ---------- top ---------- */
.top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px 24px; padding: 22px 0 22px; }
.plate { position: relative; display: inline-flex; flex-direction: column; padding: 10px 34px 9px; background: var(--grain), linear-gradient(135deg, #e6c47a, var(--brass) 40%, #96702a 70%, #dcb865); color: #3a2a0c; border-radius: 3px; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.55) inset, 0 -2px 3px rgba(80, 50, 10, 0.5) inset, 0 8px 14px -4px rgba(0, 0, 0, 0.7); }
.plate::before, .plate::after { content: ""; position: absolute; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f4dfa0, #8a6620 70%); box-shadow: 0 1px 1px rgba(0, 0, 0, 0.6); }
.plate::before { left: 11px; } .plate::after { right: 11px; }
.plate h1 { font: 400 clamp(1.9rem, 4.6vw, 2.7rem)/1 var(--type); letter-spacing: 0.22em; text-transform: uppercase; text-shadow: 0 1px 0 rgba(255, 238, 190, 0.7), 0 -1px 0 rgba(80, 50, 10, 0.5); }
.plate .sub { font: 700 0.72rem/1.2 var(--small); letter-spacing: 0.2em; text-transform: uppercase; margin-top: 5px; opacity: 0.85; }
.tools { display: flex; align-items: center; gap: 14px; }
.tabs { display: flex; gap: 8px; }
.tabs button { position: relative; cursor: pointer; padding: 9px 16px 8px; font: 400 0.95rem/1 var(--type); letter-spacing: 0.16em; text-transform: uppercase; color: #cdbb8d; background: rgba(0, 0, 0, 0.25); border: 1.5px solid rgba(220, 195, 140, 0.4); border-radius: 2px; transition: background 0.45s var(--ease), color 0.45s, transform 0.45s var(--ease); }
.tabs button:hover { transform: translateY(-2px); }
.tabs button[aria-pressed="true"] { background: var(--stamp); color: #fbeed0; border-color: #e07b6f; transform: rotate(-1.5deg); box-shadow: 0 0 0 2px rgba(179, 52, 42, 0.35); }
.help { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font: 400 1.15rem/1 var(--type); color: #e8d39a; background: rgba(0, 0, 0, 0.25); border: 1.5px solid rgba(220, 195, 140, 0.4); transition: transform 0.4s var(--ease), background 0.3s; }
.help:hover { transform: rotate(10deg) scale(1.08); background: rgba(196, 154, 69, 0.3); }

/* ---------- layout ---------- */
.work { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); gap: clamp(22px, 3.4vw, 54px); align-items: start; }

/* ---------- the form ---------- */
.form {
  position: relative; color: var(--ink); padding: 0 0 26px; transform: rotate(-0.35deg);
  background:
    radial-gradient(60px 46px at 9% 90%, rgba(130, 86, 30, 0.16), transparent 72%),
    radial-gradient(circle at 9% 90%, transparent 0 34px, rgba(130, 86, 30, 0.22) 35px 37px, transparent 39px),
    linear-gradient(to bottom, transparent calc(33.3% - 1px), rgba(90, 60, 20, 0.12) 33.3%, rgba(255, 255, 255, 0.3) calc(33.3% + 1px), transparent calc(33.3% + 3px)),
    linear-gradient(to bottom, transparent calc(66.6% - 1px), rgba(90, 60, 20, 0.12) 66.6%, rgba(255, 255, 255, 0.3) calc(66.6% + 1px), transparent calc(66.6% + 3px)),
    linear-gradient(90deg, transparent calc(50% - 1px), rgba(90, 60, 20, 0.1) 50%, rgba(255, 255, 255, 0.25) calc(50% + 1px), transparent calc(50% + 3px)),
    var(--grain), repeating-linear-gradient(0deg, rgba(140, 100, 40, 0.06) 0 1px, transparent 1px 4px), linear-gradient(170deg, #efe2b4, var(--paper) 45%, var(--paper2));
  box-shadow: 0 2px 0 rgba(255, 255, 255, 0.35) inset, 0 22px 34px -12px rgba(0, 0, 0, 0.8), 0 3px 4px rgba(0, 0, 0, 0.5);
}
.form::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12px; background: radial-gradient(circle at 6px 0, #26160d 0 3.6px, transparent 4px) 0 0 / 14px 12px repeat-x; opacity: 0.8; }
.fh { margin: 22px clamp(14px, 2.4vw, 30px) 0; display: flex; align-items: stretch; justify-content: space-between; gap: 12px; border: 2.5px solid var(--ink); }
.fh b { flex: 1; display: grid; place-items: center; padding: 8px 10px 7px; background: var(--ink); color: #efe2b4; font: 400 clamp(1.4rem, 3.2vw, 2.1rem)/1 var(--type); letter-spacing: 0.5em; padding-left: calc(10px + 0.5em); }
.fh span { display: grid; place-items: center; padding: 4px 14px; font: 700 0.78rem/1.25 var(--small); letter-spacing: 0.14em; text-transform: uppercase; text-align: center; }
.fh span i { display: block; font: 400 1.3rem/1 var(--type); letter-spacing: 0; font-style: normal; }
.fields { margin: 12px clamp(14px, 2.4vw, 30px) 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1.5px solid rgba(42, 33, 24, 0.7); font: 700 0.68rem/1.2 var(--small); letter-spacing: 0.14em; text-transform: uppercase; }
.fields div { padding: 5px 9px 6px; border-right: 1px solid rgba(42, 33, 24, 0.5); } .fields div:last-child { border-right: 0; }
.fields i { display: block; font: 400 1.05rem/1.25 var(--type); letter-spacing: 0.05em; font-style: normal; }
.fine { margin: 10px clamp(14px, 2.4vw, 30px) 0; font: 400 0.66rem/1.4 var(--small); letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; }
.msg { margin: 18px clamp(14px, 2.4vw, 30px) 0; padding: 14px 0 6px; display: flex; flex-wrap: wrap; gap: 20px calc(var(--cw) * 0.7); background: repeating-linear-gradient(transparent 0 calc(var(--cw) * 2.3 - 1px), rgba(60, 80, 140, 0.16) calc(var(--cw) * 2.3 - 1px) calc(var(--cw) * 2.3)); background-position: 0 14px; }
.w { display: inline-flex; align-items: flex-start; }
.c { position: relative; width: var(--cw); padding: 0; border: 0; background: none; cursor: pointer; display: grid; justify-items: center; align-content: start; -webkit-tap-highlight-color: transparent; }
.c .k { position: relative; display: block; width: 100%; text-align: center; padding: 1px 0 0; font: 400 calc(var(--cw) * 0.98)/1.12 var(--type); color: rgba(42, 33, 24, var(--op, 0.92)); transform: translateY(var(--dy, 0px)) rotate(var(--rot, 0deg)); background: linear-gradient(var(--marker), var(--marker)) 0 78% / 0% 62% no-repeat; transition: background-size 0.4s var(--ease); mix-blend-mode: multiply; }
.c.sel .k { background-size: 100% 62%; }
.c .g { display: block; width: 100%; height: calc(var(--cw) * 1.2); margin-top: 1px; text-align: center; border-bottom: 1.5px solid rgba(42, 33, 24, 0.55); font: 400 calc(var(--cw) * 1.3)/0.9 var(--hand); color: var(--pencil); text-shadow: 0 0 1px rgba(61, 66, 88, 0.6); }
.c.lock .g { color: var(--stamp); text-shadow: 0 0 1px rgba(179, 52, 42, 0.5); }
.c.sel .g { border-bottom-color: var(--stamp); border-bottom-width: 2.5px; }
.p { align-self: flex-start; font: 400 calc(var(--cw) * 0.98)/1.12 var(--type); padding-top: 1px; color: var(--ink); width: calc(var(--cw) * 0.5); text-align: center; }
.foot { margin: 8px clamp(14px, 2.4vw, 30px) 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 400 0.78rem/1.3 var(--small); letter-spacing: 0.12em; text-transform: uppercase; }
.foot span:last-child { font-family: var(--hand); font-size: 1.5rem; letter-spacing: 0; text-transform: none; color: var(--pencil); }
.stamp { position: absolute; right: 8%; top: 36%; z-index: 4; padding: 8px 20px 4px; border: 5px solid var(--stamp); border-radius: 6px; color: var(--stamp); font: 400 clamp(2.2rem, 6vw, 4rem)/1 var(--type); letter-spacing: 0.1em; text-transform: uppercase; transform: rotate(-12deg); opacity: 0; pointer-events: none; mix-blend-mode: multiply; filter: url(#ink); }
.stamp.in { opacity: 0.88; }
.stamp small { display: block; font: 700 0.8rem/1.3 var(--small); letter-spacing: 0.2em; text-align: center; margin-top: 2px; }
.cipher .c .k { filter: none; }

/* ---------- desk ---------- */
.desk { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-content: start; min-width: 0; }
.desk > * { min-width: 0; }
.coach { min-height: 3.2em; padding: 2px 0 2px 16px; border-left: 3px solid var(--brass); }
.coach b { display: block; font: 400 1.35rem/1.15 var(--type); color: #f3e7c5; letter-spacing: 0.02em; }
.coach span { color: #c8b78e; }
.freq { display: flex; flex-wrap: wrap; gap: 6px; }
.freq button { display: inline-flex; align-items: baseline; gap: 5px; padding: 5px 8px 4px; cursor: pointer; font: 400 1.05rem/1 var(--type); color: #e8d9a6; background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(220, 195, 140, 0.35); border-radius: 2px; transition: background 0.3s, color 0.3s, transform 0.3s var(--ease); }
.freq button small { font: 700 0.62rem/1 var(--small); opacity: 0.7; }
.freq button.sel { background: var(--marker); color: #2a2118; transform: translateY(-2px); }
.freq button.done { opacity: 0.45; }
.freqT, .keysT { font: 700 0.68rem/1 var(--small); letter-spacing: 0.22em; text-transform: uppercase; color: #b8a67a; margin-bottom: 8px; }
.keys { display: grid; grid-template-columns: minmax(0, 1fr); gap: 7px; justify-items: center; padding: 16px 12px 14px; border-radius: 5px; background: var(--grain), linear-gradient(160deg, #2d2a27, #1c1a18); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07), inset 0 2px 8px rgba(0, 0, 0, 0.6), 0 12px 20px -8px rgba(0, 0, 0, 0.7); }
.krow { display: flex; gap: clamp(4px, 0.9vw, 9px); justify-content: center; width: 100%; padding: 0 4px; }
.key { position: relative; flex: 1 1 0; max-width: 44px; min-width: 0; aspect-ratio: 0.82; display: grid; place-items: center; cursor: pointer; padding: 0; border-radius: 50% 50% 46% 46% / 52% 52% 42% 42%; border: 0; color: #2a2118; font: 400 clamp(0.95rem, 3.4vw, 1.3rem)/1 var(--type); background: radial-gradient(circle at 35% 28%, #fffaeb, var(--key) 55%, #c9bb92); box-shadow: 0 0 0 3px #8f9498, 0 0 0 4px #4a4f53, 0 5px 0 4px #666c70, 0 8px 8px 3px rgba(0, 0, 0, 0.6); transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), opacity 0.4s; }
.key:active, .key.dn { transform: translateY(4px); box-shadow: 0 0 0 3px #8f9498, 0 0 0 4px #4a4f53, 0 1px 0 4px #666c70, 0 2px 3px 3px rgba(0, 0, 0, 0.6); }
.key small { position: absolute; right: 2px; top: 1px; font: 700 0.5rem/1 var(--small); color: var(--stamp); }
.key.used { opacity: 0.45; }
.key.nope { animation: nope 0.4s ease; }
@keyframes nope { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.acts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { white-space: nowrap; cursor: pointer; padding: 11px 16px 10px; font: 400 0.95rem/1 var(--type); letter-spacing: 0.12em; text-transform: uppercase; color: #2a2118; background: var(--grain), linear-gradient(#ecd89a, #cfb26a); border: 0; border-radius: 2px; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 3px 0 #86671f, 0 6px 8px rgba(0, 0, 0, 0.5); transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), opacity 0.3s; }
.btn:hover:not(:disabled) { transform: translateY(-2px); } .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #86671f; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.dark { color: #e8d9a6; background: rgba(0, 0, 0, 0.3); box-shadow: inset 0 0 0 1.5px rgba(220, 195, 140, 0.4); }
.btn.ghost { color: #2a2118; background: transparent; box-shadow: inset 0 0 0 1.5px rgba(42, 33, 24, 0.55); }
.btn.red { color: #fbeed0; background: linear-gradient(#c8483c, var(--stamp)); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.3) inset, 0 3px 0 #6e1f19, 0 6px 8px rgba(0, 0, 0, 0.5); }
.meter { display: flex; align-items: baseline; gap: 18px; margin-left: auto; font: 400 1.6rem/1 var(--type); color: #efe0b0; font-variant-numeric: tabular-nums; }
.meter small { font: 700 0.64rem/1 var(--small); letter-spacing: 0.18em; text-transform: uppercase; color: #b8a67a; margin-left: 6px; }
.tkey { width: 100%; max-width: 300px; justify-self: end; margin-top: -4px; }
.slip { position: relative; padding: 22px 22px 20px; color: var(--ink); text-align: center; transform-origin: 50% 0; background: var(--grain), repeating-linear-gradient(0deg, rgba(140, 100, 40, 0.06) 0 1px, transparent 1px 4px), linear-gradient(170deg, #efe2b4, var(--paper)); box-shadow: 0 16px 24px -10px rgba(0, 0, 0, 0.8); }
.slip::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px; background: radial-gradient(circle at 6px 0, #26160d 0 3.2px, transparent 3.6px) 0 0 / 12px 10px repeat-x; opacity: 0.75; }
.slip h2 { font: 400 1.8rem/1.05 var(--type); letter-spacing: 0.12em; text-transform: uppercase; color: var(--stamp); margin-top: 6px; }
.slip.lost h2 { color: #6b5a3c; }
.slip p { margin-top: 6px; }
.slip .stats { display: flex; justify-content: center; gap: 28px; margin: 14px 0 4px; }
.slip .stats div { display: grid; gap: 3px; } .slip .stats b { font: 400 1.8rem/1 var(--type); font-variant-numeric: tabular-nums; } .slip .stats span { font: 700 0.64rem/1 var(--small); letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; }
.slip .foot2 { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
.slip .next { margin-top: 12px; font: 700 0.72rem/1 var(--small); letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.7; font-variant-numeric: tabular-nums; }
.record h3 { font: 700 0.68rem/1 var(--small); letter-spacing: 0.22em; text-transform: uppercase; color: #b8a67a; padding-bottom: 10px; border-bottom: 1px dashed rgba(220, 195, 140, 0.35); margin-bottom: 12px; }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.nums div { display: grid; gap: 4px; } .nums b { font: 400 1.7rem/1 var(--type); font-variant-numeric: tabular-nums; color: #f3e7c5; } .nums span { font: 700 0.62rem/1 var(--small); letter-spacing: 0.14em; text-transform: uppercase; color: #b8a67a; }

/* ---------- how to play ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 14px max(14px, env(safe-area-inset-left, 0px)); background: rgba(14, 8, 4, 0.78); animation: fadein 0.3s ease-out both; }
@keyframes fadein { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(22px) rotate(1.2deg); } }
.how { --loop: 13s; --cw: 30px; width: 100%; max-width: 500px; max-height: 100%; overflow: auto; padding: 26px 22px 20px; display: grid; gap: 14px; color: var(--ink); background: var(--grain), repeating-linear-gradient(0deg, rgba(140, 100, 40, 0.06) 0 1px, transparent 1px 4px), linear-gradient(170deg, #efe2b4, var(--paper) 50%, var(--paper2)); box-shadow: 0 30px 70px -10px rgba(0, 0, 0, 0.9); animation: rise 0.7s var(--ease) both; position: relative; }
.how::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12px; background: radial-gradient(circle at 6px 0, #26160d 0 3.6px, transparent 4px) 0 0 / 14px 12px repeat-x; opacity: 0.8; }
.how h2 { font: 400 1.7rem/1 var(--type); letter-spacing: 0.14em; text-transform: uppercase; color: var(--stamp); }
.how .lead { margin-top: -6px; opacity: 0.8; }
.demo { position: relative; padding: 16px 14px 12px; border: 1.5px solid rgba(42, 33, 24, 0.5); display: grid; justify-items: center; gap: 8px; background: rgba(255, 255, 255, 0.18); overflow: hidden; }
.demo .row { display: flex; gap: 2px; }
.demo .c { cursor: default; }
.demo .c .k { transition: none; }
.demo .c.o .k { animation: hlO var(--loop) infinite; } .demo .c.o .g { animation: gL var(--loop) infinite; }
.demo .c.h .k { animation: hlH var(--loop) infinite; } .demo .c.h .g { animation: gE var(--loop) infinite; }
.demo .c.kk .k { animation: hlK var(--loop) infinite; } .demo .c.kk .g { animation: gH var(--loop) infinite; }
.demo .c.r .k { animation: hlR var(--loop) infinite; } .demo .c.r .g { animation: gO var(--loop) infinite; }
@keyframes hlO { 0%, 6% { background-size: 0% 62%; } 11%, 27% { background-size: 100% 62%; } 31%, 100% { background-size: 0% 62%; } }
@keyframes gL { 0%, 17% { opacity: 0; clip-path: inset(0 100% 0 0); } 24%, 96% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 0; clip-path: inset(0 100% 0 0); } }
@keyframes hlH { 0%, 34% { background-size: 0% 62%; } 38%, 50% { background-size: 100% 62%; } 54%, 100% { background-size: 0% 62%; } }
@keyframes gE { 0%, 42% { opacity: 0; clip-path: inset(0 100% 0 0); } 47%, 96% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 0; clip-path: inset(0 100% 0 0); } }
@keyframes hlK { 0%, 56% { background-size: 0% 62%; } 60%, 70% { background-size: 100% 62%; } 74%, 100% { background-size: 0% 62%; } }
@keyframes gH { 0%, 63% { opacity: 0; clip-path: inset(0 100% 0 0); } 68%, 96% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 0; clip-path: inset(0 100% 0 0); } }
@keyframes hlR { 0%, 76% { background-size: 0% 62%; } 80%, 88% { background-size: 100% 62%; } 92%, 100% { background-size: 0% 62%; } }
@keyframes gO { 0%, 83% { opacity: 0; clip-path: inset(0 100% 0 0); } 88%, 96% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 0; clip-path: inset(0 100% 0 0); } }
.demo .stamp { position: absolute; right: 10px; top: 34px; font-size: 1.5rem; border-width: 3px; padding: 4px 10px 2px; opacity: 0; filter: none; animation: dstamp var(--loop) infinite; }
@keyframes dstamp { 0%, 89% { opacity: 0; transform: rotate(-12deg) scale(2.2); } 92% { opacity: 0.9; transform: rotate(-12deg) scale(0.95); } 94%, 97% { opacity: 0.88; transform: rotate(-12deg) scale(1); } 100% { opacity: 0; transform: rotate(-12deg) scale(1); } }
.demo .cap { font: 700 0.7rem/1 var(--small); letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; }
.how ol { list-style: none; padding: 0; display: grid; gap: 10px; counter-reset: s; }
.how li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.how li::before { content: counter(s); width: 28px; height: 28px; display: grid; place-items: center; font: 400 1.05rem/1 var(--type); color: var(--stamp); border: 1.5px solid var(--stamp); border-radius: 50%; }
.how .foot3 { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.how .foot3 p { font-size: 0.9rem; opacity: 0.75; }

@media (max-width: 960px) {
  :root { --cw: 24px; }
  .work { grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fields div:nth-child(2) { border-right: 0; } .fields div:nth-child(-n+2) { border-bottom: 1px solid rgba(42, 33, 24, 0.5); }

    stopClock(); S.done = true; S.won = won; S.sel = null;
    var st = stats(); st.played++;
    if (won) { st.won++; st.streak = (S.mode === 'daily') ? ((st.lastWin === dayNo - 1 || st.lastWin === dayNo) ? st.streak + 1 : 1) : st.streak + 1; if (S.mode === 'daily') st.lastWin = dayNo; if (!st.best || S.ms < st.best) st.best = S.ms; } else st.streak = 0;
    save1(); save();
    paint(); $('tools').hidden = true;
    var all = $('msg').querySelectorAll('.c');
    if (won) {
      for (var i = 0; i < all.length; i++) anim(all[i].querySelector('.g'), [{ color: '#3d4258' }, { color: '#b3342a', offset: 0.4 }, { color: '#2a2118' }], { duration: 900, delay: i * 35, fill: 'both' });
      var stamp = $('stamp'); $('stampT').textContent = new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' · ' + fmtTime(S.ms);
      clearTimeout(slipTimer);
      slipTimer = setTimeout(function () {
        stamp.classList.add('in');
        anim(stamp, [{ opacity: 0, transform: 'rotate(-12deg) scale(2.4)' }, { opacity: 0.95, transform: 'rotate(-12deg) scale(0.94)', offset: 0.6 }, { opacity: 0.88, transform: 'rotate(-12deg) scale(1)' }], { duration: 520 });
        anim($('form'), [{ transform: 'rotate(-0.35deg) translateY(0)' }, { transform: 'rotate(-0.35deg) translateY(5px)', offset: 0.5 }, { transform: 'rotate(-0.35deg) translateY(0)' }], { duration: 360, delay: 380, fill: 'none' });
        setTimeout(function () { showSlip(false); renderRecord(); }, reduce ? 0 : 900);
      }, reduce ? 0 : 400 + all.length * 35);
    } else { showSlip(false); renderRecord(); }
    $('coach').innerHTML = won ? '<b>Message received</b><span>' + (S.hints ? 'Decoded with ' + S.hints + (S.hints === 1 ? ' hint.' : ' hints.') : 'Decoded without a single hint.') + '</span>' : '<b>Message left unread</b><span>The answer is on the form.</span>';
    $('fsig').textContent = won ? 'Decoded. Stop.' : 'Given up. Stop.';
  }
  function showSlip(instant) {
    var sl = $('slip'), txt = shareText(dayNo, S.mode, S.ms, S.hints);
    sl.className = 'slip' + (S.won ? '' : ' lost');
    sl.innerHTML = '<h2>' + (S.won ? 'Received' : 'Unread') + '</h2><p>' + (S.won ? 'You decoded the whole message.' : 'You gave up on this one. The answer is on the form.') + '</p>' +
      '<div class="stats"><div><b>' + fmtTime(S.ms) + '</b><span>Time</span></div><div><b>' + S.hints + '</b><span>Hints</span></div></div>' +
      '<div class="foot2"><button type="button" class="btn" id="copy">Copy result</button>' + (S.mode === 'daily' ? '<button type="button" class="btn ghost" id="toEnd">Play endless</button>' : '<button type="button" class="btn red" id="nextM">Next message</button><button type="button" class="btn ghost" id="toDaily">Back to daily</button>') + '</div>' + (S.mode === 'daily' ? '<p class="next" id="nextin"></p>' : '');
    sl.hidden = false;
    $('copy').addEventListener('click', function () { var b = this, done = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy result'; }, 1600); }; try { navigator.clipboard.writeText(txt).then(done, function () { fb(txt); done(); }); } catch (e) { fb(txt); done(); } });
    var a = $('toEnd'); if (a) a.addEventListener('click', function () { go('endless'); });
    var n = $('nextM'); if (n) n.addEventListener('click', function () { store.e = null; init('endless'); });
    var d = $('toDaily'); if (d) d.addEventListener('click', function () { go('daily'); });
    tick();
    if (!instant) { if (window.innerWidth <= 960 && !reduce) { try { sl.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {} } anim(sl, [{ opacity: 0, transform: 'translateY(-18px) rotate(2deg)' }, { opacity: 1, transform: 'translateY(2px) rotate(-0.6deg)', offset: 0.7 }, { opacity: 1, transform: 'none' }], { duration: 800 }); }
  }
  function fb(t) { var a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(a); }
  function renderRecord() {
    var st = stats();
    $('recT').textContent = 'Record · ' + (S.mode === 'daily' ? 'Daily' : 'Endless');
    $('nums').innerHTML = '<div><b>' + st.won + '</b><span>Received</span></div><div><b>' + st.streak + '</b><span>Streak</span></div><div><b>' + (st.best ? fmtTime(st.best) : '–') + '</b><span>Best time</span></div><div><b>' + st.played + '</b><span>Played</span></div>';
  }

  /* ---------- modes ---------- */
  function init(mode) {
    S.mode = mode; clearTimeout(slipTimer); stopClock();
    $('mDaily').setAttribute('aria-pressed', mode === 'daily'); $('mEndless').setAttribute('aria-pressed', mode === 'endless');
    var r = rec();
    if (mode === 'daily') { if (!r || r.key !== todayKey) { store.d = r = { key: todayKey, g: {}, lk: {}, ms: 0, hints: 0, done: false, won: false }; save(); } S.seed = todayKey; }
    else { if (!r || !r.seed) { store.e = r = { seed: newSeed(), g: {}, lk: {}, ms: 0, hints: 0, done: false, won: false }; save(); } S.seed = r.seed; }
    S.puz = makePuzzle(S.seed);
    S.guess = r.g || {}; S.lock = r.lk || {}; S.ms = +r.ms || 0; S.hints = +r.hints || 0; S.done = !!r.done; S.won = !!r.won; S.gaveUp = !!r.gu; timerOn = false;
    S.sel = S.done ? null : (S.puz.order.filter(function (c) { return !S.guess[c]; })[0] || S.puz.order[0]);
    $('sub').textContent = mode === 'daily' ? 'No. ' + dayNo + ' · ' + new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }) : 'Endless · a new message each round';
    var gb = $('giveup'); gb.removeAttribute('data-sure'); gb.textContent = 'Give up';
    $('stamp').classList.remove('in'); $('slip').hidden = true; $('tools').hidden = S.done;
    buildMsg(); buildFreq(); paint(); updateCoach(); renderRecord();
    $('clock').textContent = fmtTime(S.ms);
    if (S.done) {
      $('stamp').classList.toggle('in', S.won); if (S.won) $('stampT').textContent = fmtTime(S.ms);
      $('coach').innerHTML = S.won ? '<b>Message received</b><span>' + (S.hints ? 'Decoded with ' + S.hints + (S.hints === 1 ? ' hint.' : ' hints.') : 'Decoded without a single hint.') + '</span>' : '<b>Message left unread</b><span>The answer is on the form.</span>';
      $('fsig').textContent = S.won ? 'Decoded. Stop.' : 'Given up. Stop.'; showSlip(true);
    } else $('fsig').innerHTML = '&nbsp;';
    anim($('form'), [{ opacity: 0, transform: 'translateY(22px) rotate(1.2deg)' }, { opacity: 1, transform: 'rotate(-0.35deg)' }], { duration: 800 });
    var all = $('msg').querySelectorAll('.k');
    for (var i = 0; i < all.length; i++) anim(all[i], [{ opacity: 0 }, { opacity: 1 }], { duration: 250, delay: 350 + i * 22 });
    anim($('keys'), [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 650, delay: 200 });
  }
  function go(m) { init(m); try { location.hash = m; } catch (e) {} }
  window.addEventListener('hashchange', function () { var h = location.hash.replace('#', ''); if ((h === 'daily' || h === 'endless') && h !== S.mode) init(h); });
  $('mDaily').addEventListener('click', function () { go('daily'); }); $('mEndless').addEventListener('click', function () { go('endless'); });
  $('hint').addEventListener('click', hint); $('erase').addEventListener('click', erase); $('giveup').addEventListener('click', giveUp);
  $('msg').addEventListener('click', function (e) { var b = e.target.closest('.c'); if (b) select(b.getAttribute('data-l')); });
  $('freq').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) select(b.getAttribute('data-l')); });
  $('keys').addEventListener('click', function (e) { var b = e.target.closest('.key'); if (b) typeLetter(b.getAttribute('data-k')); });
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!$('ov').hidden) { if (e.key === 'Escape') closeHow(); return; }
    if (S.done) return;
    var k = e.key;
    if (/^[a-zA-Z]$/.test(k)) { e.preventDefault(); typeLetter(k.toUpperCase()); }
    else if (k === 'Backspace' || k === 'Delete') { e.preventDefault(); erase(); }
    else if (k === 'ArrowRight' || k === 'ArrowLeft') {
      e.preventDefault(); var o = S.puz.order, i = o.indexOf(S.sel); i = (i + (k === 'ArrowRight' ? 1 : o.length - 1)) % o.length; select(o[i], true);
    }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { if (timerOn) { stopClock(); save1(); } } else if (!S.done && Object.keys(S.guess).length) startClock(); });
  window.addEventListener('pagehide', function () { if (!S.done) { stopClock(); save1(); } });

  /* ---------- how to play ---------- */
  function howHtml() {
    var h = '<h2 id="howT">How to play</h2><p class="lead">A short saying has been sent in code. Work out the code to read it.</p><div class="demo">';
    h += '<div class="row"><span class="c kk"><span class="k">K</span><span class="g">H</span></span><span class="c h"><span class="k">H</span><span class="g">E</span></span><span class="c o"><span class="k">O</span><span class="g">L</span></span><span class="c o"><span class="k">O</span><span class="g">L</span></span><span class="c r"><span class="k">R</span><span class="g">O</span></span></div>';
    h += '<p class="cap">Coded word, with your guesses under it</p><div class="stamp">Received</div></div>';
    h += '<ol><li><span><b>Tap a coded letter.</b> Every copy of it lights up.</span></li><li><span><b>Type your guess.</b> Use the keyboard on the desk. Every copy fills in at once. Each letter stands for one other letter.</span></li><li><span><b>Fill in the whole message.</b> Short words and single letters are the best clues. Stuck? Ask for a letter.</span></li></ol>';
    h += '<div class="foot3"><p>Daily: same message for everyone. Endless: a new one every time.</p><button type="button" class="btn red" id="howGo">Got it</button></div>';
    return h;
  }
  function openHow() { $('how').innerHTML = howHtml(); $('ov').hidden = false; store.seen = true; save(); $('howGo').addEventListener('click', closeHow); $('howGo').focus({ preventScroll: true }); }
  function closeHow() {
    var ov = $('ov');
    function fin() { ov.hidden = true; $('how').innerHTML = ''; try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) {} }
    var a = anim(ov, [{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: 'ease-out', fill: 'forwards' });
    if (a) a.onfinish = function () { a.cancel(); fin(); }; else fin();
  }
  $('helpBtn').addEventListener('click', openHow);
  $('ov').addEventListener('click', function (e) { if (e.target === $('ov')) closeHow(); });

  /* ---------- clock ---------- */
  function tick() {
    var now = new Date(), k = dateKey(now);
    if (k !== todayKey) { todayKey = k; dayNo = dayNumber(k); store.d = null; save(); if (S.mode === 'daily') init('daily'); return; }
    if (timerOn) $('clock').textContent = fmtTime(elapsed());
    var el = $('nextin'); if (!el) return;
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1), s = Math.max(0, Math.floor((next - now) / 1000)), p = function (n) { return String(n).padStart(2, '0'); };
    el.textContent = 'Next message in ' + p(Math.floor(s / 3600)) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60);
  }
  setInterval(tick, 500);

  buildKeys();
  var h0 = location.hash.replace('#', '');
  init(h0 === 'endless' ? 'endless' : 'daily');
  if (!store.seen) setTimeout(function () { if (!store.seen) openHow(); }, 350);
})();
</script>
