<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Swatch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a painter's drop cloth with splatters of today's colours. The board is a grid of paint chips, the
   kind you get from a hardware shop: white card edges, slightly rounded, with a soft shadow. A few chips
   carry a white dot and cannot be moved. Solve it and the gaps close up and the chips melt into one smooth
   wash of colour. Beside the board (under it on a phone) a small fan of the four corner chips, the buttons,
   the clock and the record. */
:root {
  --cloth: #e8e0cf; --cloth2: #d8ceb6; --ink: #2a2622; --card: #fbf8f1; --accent: #e0553a;
  --gap: 6px;
  --head: 'Fraunces', 'Iowan Old Style', Georgia, serif; --body: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1); --grain: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--cloth2); }
body {
  margin: 0; min-height: 100dvh; color: var(--ink); font: 500 17px/1.45 var(--body); position: relative; overflow-x: clip;
  background:
    var(--grain),
    repeating-linear-gradient(0deg, rgba(90, 70, 40, 0.07) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(90, 70, 40, 0.07) 0 1px, transparent 1px 3px),
    radial-gradient(80% 60% at 30% 10%, rgba(255, 255, 255, 0.6), transparent 70%),
    radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(110, 90, 50, 0.22)),
    var(--cloth);
  padding-block: 0 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p, ol { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #2a2622; outline-offset: 3px; }
.splat { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.splat i { position: absolute; display: block; opacity: 0.55; mix-blend-mode: multiply; }
.wrap { position: relative; z-index: 1; max-width: 1160px; margin: 0 auto; }

/* ---------- top ---------- */
.top { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 24px; padding: 24px 0 18px; }
.chipcard { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); width: min(100%, 330px); background: var(--card); padding: 0 0 12px; box-shadow: 0 1px 0 #fff inset, 0 0 0 1px rgba(60, 40, 10, 0.15), 0 12px 18px -8px rgba(60, 40, 10, 0.5); transform: rotate(-1.2deg); }
.chipcard b { display: block; height: 22px; }
.chipcard .t { grid-column: 1 / -1; padding: 10px 14px 0; }
.chipcard h1 { font: 700 clamp(2rem, 5vw, 2.7rem)/1 var(--head); letter-spacing: -0.01em; }
.chipcard p { font: 500 0.78rem/1.2 var(--body); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; opacity: 0.6; }
.chipcard::after { content: ""; position: absolute; right: 12px; bottom: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--cloth2); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5); }
.tools { display: flex; align-items: center; gap: 12px; margin-left: auto; flex-wrap: wrap; }
.tabs, .sizes { display: flex; padding: 4px; border-radius: 999px; background: rgba(251, 248, 241, 0.8); box-shadow: inset 0 0 0 1.5px rgba(42, 38, 34, 0.25); }
.tabs button, .sizes button { cursor: pointer; padding: 9px 18px; border: 0; border-radius: 999px; font: 700 0.92rem/1 var(--body); background: transparent; color: #5d5448; transition: background 0.35s var(--ease), color 0.35s; }
.sizes button { padding: 9px 13px; }
.tabs button[aria-pressed="true"], .sizes button[aria-pressed="true"] { background: var(--ink); color: #fbf8f1; }
.help { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font: 700 1.1rem/1 var(--head); color: #fbf8f1; background: var(--ink); border: 0; box-shadow: 0 4px 8px rgba(60, 40, 10, 0.35); transition: transform 0.35s var(--ease); }
.help:hover { transform: rotate(10deg) scale(1.1); }

/* ---------- layout ---------- */
.work { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: clamp(22px, 3.4vw, 48px); align-items: start; justify-content: center; }
.left, .right { display: grid; gap: 18px; min-width: 0; }
.left { justify-items: center; }

/* ---------- board ---------- */
.mount { --cols: 5; --rows: 7; position: relative; width: min(100%, 520px, max(260px, calc((100dvh - 250px) * var(--cols) / var(--rows)))); padding: clamp(8px, 2vw, 14px); background: var(--card); border-radius: 6px; box-shadow: 0 1px 0 #fff inset, 0 0 0 1px rgba(60, 40, 10, 0.15), 0 22px 34px -12px rgba(60, 40, 10, 0.55); touch-action: none; user-select: none; -webkit-user-select: none; }
.grid { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: var(--gap); transition: gap 1s var(--ease); }
.tile { position: relative; aspect-ratio: 1; padding: 0; border: 3px solid var(--card); border-radius: 7px; cursor: grab; background: #999; box-shadow: 0 0 0 1px rgba(60, 40, 10, 0.12), 0 2px 3px rgba(60, 40, 10, 0.3), inset 0 -3px 6px rgba(0, 0, 0, 0.1), inset 0 2px 3px rgba(255, 255, 255, 0.25); transition: border-radius 1s var(--ease), border-width 1s var(--ease), box-shadow 1s var(--ease), outline-offset 0.3s; touch-action: none; -webkit-tap-highlight-color: transparent; overflow: hidden; }
.tile::before { content: ""; position: absolute; inset: 0; background: var(--grain); mix-blend-mode: multiply; opacity: 0.55; pointer-events: none; }
.tile.fixed { cursor: default; }
.tile .dot { position: absolute; left: 50%; top: 50%; width: 22%; height: 22%; margin: -11% 0 0 -11%; border-radius: 50%; background: rgba(255, 255, 255, 0.92); box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.18), 0 1px 3px rgba(0, 0, 0, 0.35); display: none; }
.tile.fixed .dot { display: block; }
.tile.sel { outline: 3px solid var(--ink); outline-offset: 2px; z-index: 3; transform: translateY(-3px) scale(1.05); box-shadow: 0 10px 16px rgba(60, 40, 10, 0.4); }
.tile.drag { z-index: 6; cursor: grabbing; box-shadow: 0 16px 22px rgba(60, 40, 10, 0.45); transition: none; }
.tile.hover { outline: 3px dashed rgba(42, 38, 34, 0.7); outline-offset: 2px; }
.mount.won .grid { gap: 0; }
.mount.won .tile { border-radius: 0; border-width: 0; box-shadow: none; cursor: default; }
.mount.won .tile .dot { opacity: 0; transition: opacity 0.6s; }
.mount.won .grid { border-radius: 4px; overflow: hidden; }
.shine { position: absolute; inset: 10px; pointer-events: none; overflow: hidden; border-radius: 4px; }
.shine::after { content: ""; position: absolute; top: -10%; bottom: -10%; left: -40%; width: 30%; transform: skewX(-18deg); background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent); opacity: 0; }
.mount.won .shine::after { animation: sweep 1.4s ease 0.9s both; }
@keyframes sweep { 0% { left: -40%; opacity: 1; } 100% { left: 130%; opacity: 1; } }
.stat { width: min(100%, 520px); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 700 0.78rem/1.2 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: #6a5f50; }
.stat b { font: 700 1.5rem/1 var(--head); letter-spacing: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat span { display: flex; align-items: baseline; gap: 8px; }
.coach { width: min(100%, 520px); min-height: 3em; text-align: center; color: #5d5448; font-size: 0.98rem; }
.coach b { display: block; font: 600 1.2rem/1.2 var(--head); color: var(--ink); margin-bottom: 2px; }

/* ---------- side ---------- */
.fan { position: relative; height: 150px; margin: 6px 0 0; }
.fan div { position: absolute; left: 50%; bottom: 0; width: 76px; height: 128px; margin-left: -38px; transform-origin: 50% 118%; background: var(--card); padding: 6px 6px 0; box-shadow: 0 0 0 1px rgba(60, 40, 10, 0.15), 0 6px 10px rgba(60, 40, 10, 0.3); }
.fan div i { display: block; height: 80px; border-radius: 2px; }
.fan div span { display: block; margin-top: 5px; font: 700 0.62rem/1.15 var(--body); letter-spacing: 0.04em; text-transform: uppercase; color: #4c4338; text-align: center; }
.sidehead { font: 700 0.72rem/1 var(--body); letter-spacing: 0.18em; text-transform: uppercase; color: #6a5f50; }
.acts { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { white-space: nowrap; cursor: pointer; padding: 12px 18px; border-radius: 999px; border: 0; font: 700 0.95rem/1 var(--body); color: #fbf8f1; background: var(--ink); box-shadow: 0 4px 0 #000, 0 8px 12px rgba(60, 40, 10, 0.3); transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), opacity 0.3s; }
.btn:hover:not(:disabled) { transform: translateY(-2px); } .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.accent { background: var(--accent); box-shadow: 0 4px 0 #8d2b17, 0 8px 12px rgba(60, 40, 10, 0.3); }
.btn.paper { color: var(--ink); background: var(--card); box-shadow: 0 0 0 1.5px rgba(42, 38, 34, 0.4), 0 4px 0 rgba(42, 38, 34, 0.5), 0 8px 12px rgba(60, 40, 10, 0.2); }
.btn.ghost { color: var(--ink); background: transparent; box-shadow: inset 0 0 0 1.5px rgba(42, 38, 34, 0.5); }
.slip { position: relative; width: min(100%, 520px); padding: 22px 22px 20px; text-align: center; background: var(--card); box-shadow: 0 0 0 1px rgba(60, 40, 10, 0.15), 0 18px 28px -10px rgba(60, 40, 10, 0.5); }
.slip h2 { font: 700 2rem/1 var(--head); }
.slip p { margin-top: 6px; }
.slip .strip { display: flex; height: 14px; margin: 12px auto 0; max-width: 280px; border-radius: 2px; overflow: hidden; }
.slip .strip i { flex: 1; }
.slip .stats { display: flex; justify-content: center; gap: 26px; margin: 14px 0 4px; }
.slip .stats div { display: grid; gap: 3px; } .slip .stats b { font: 700 1.8rem/1 var(--head); font-variant-numeric: tabular-nums; } .slip .stats span { font: 700 0.68rem/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.6; }
.slip .foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
.slip .next { margin-top: 12px; font: 700 0.74rem/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.6; font-variant-numeric: tabular-nums; }
.record h3 { font: 700 0.72rem/1 var(--body); letter-spacing: 0.18em; text-transform: uppercase; color: #6a5f50; padding-bottom: 10px; border-bottom: 1.5px solid rgba(42, 38, 34, 0.25); margin-bottom: 12px; }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.nums div { display: grid; gap: 4px; } .nums b { font: 700 1.55rem/1 var(--head); font-variant-numeric: tabular-nums; } .nums span { font: 700 0.62rem/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: #6a5f50; white-space: nowrap; }

/* ---------- how to play ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 14px max(14px, env(safe-area-inset-left, 0px)); background: rgba(42, 34, 22, 0.6); animation: fadein 0.3s ease-out both; }
@keyframes fadein { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(22px) rotate(-1deg); } }
.how { --loop: 13s; width: 100%; max-width: 470px; max-height: 100%; overflow: auto; padding: 24px 22px 20px; display: grid; gap: 14px; background: var(--card); border-radius: 6px; box-shadow: 0 30px 70px -10px rgba(40, 25, 5, 0.7); animation: rise 0.7s var(--ease) both; }
.how h2 { font: 700 1.8rem/1 var(--head); }
.how .lead { margin-top: -6px; opacity: 0.8; }
.demo { display: grid; gap: 12px; justify-items: center; padding: 16px 14px 12px; background: var(--cloth); border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(60, 40, 10, 0.12); }
.dgrid { width: min(100%, 210px); display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; background: var(--card); border-radius: 5px; box-shadow: 0 8px 14px -6px rgba(60, 40, 10, 0.5); animation: dgap var(--loop) infinite; }
.dgrid .tile { cursor: default; box-shadow: 0 0 0 1px rgba(60, 40, 10, 0.12), 0 2px 3px rgba(60, 40, 10, 0.3); animation: dflat var(--loop) infinite; }
@keyframes dgap { 0%, 56% { gap: 6px; } 66%, 94% { gap: 0; } 100% { gap: 6px; } }
@keyframes dflat { 0%, 56% { border-width: 3px; border-radius: 7px; } 66%, 94% { border-width: 0; border-radius: 0; } 100% { border-width: 3px; border-radius: 7px; } }
.dcap { position: relative; width: 100%; height: 2.7em; font-size: 0.95rem; text-align: center; }
.dcap span { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; line-height: 1.3; }
.dcap span:nth-child(1) { animation: k1 var(--loop) infinite; } .dcap span:nth-child(2) { animation: k2 var(--loop) infinite; } .dcap span:nth-child(3) { animation: k3 var(--loop) infinite; } .dcap span:nth-child(4) { animation: k4 var(--loop) infinite; }
@keyframes k1 { 0%, 2% { opacity: 0; } 5%, 27% { opacity: 1; } 30%, 100% { opacity: 0; } }
@keyframes k2 { 0%, 29% { opacity: 0; } 32%, 52% { opacity: 1; } 55%, 100% { opacity: 0; } }
@keyframes k3 { 0%, 54% { opacity: 0; } 58%, 72% { opacity: 1; } 75%, 100% { opacity: 0; } }
@keyframes k4 { 0%, 74% { opacity: 0; } 78%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
.how ol { list-style: none; padding: 0; display: grid; gap: 10px; counter-reset: s; }
.how li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.how li::before { content: counter(s); width: 28px; height: 28px; display: grid; place-items: center; font: 700 1rem/1 var(--head); color: #fbf8f1; background: var(--ink); border-radius: 50%; }
.how .foot3 { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.how .foot3 p { font-size: 0.88rem; opacity: 0.7; }

@media (max-width: 960px) { .work { grid-template-columns: minmax(0, 1fr); } .tools { margin-left: 0; } .fan { display: none; } .fanwrap { display: none; } }
@media (max-width: 440px) { :root { --gap: 4px; } .tile { border-width: 2px; border-radius: 5px; } .tabs button { padding: 9px 14px; } .nums b { font-size: 1.35rem; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>

<div class="splat" id="splat" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="chipcard" id="chipcard"><b></b><b></b><b></b><b></b><b></b><b></b><div class="t"><h1>Swatch</h1><p id="sub"></p></div></div>
    <div class="tools">
      <div class="tabs" role="group" aria-label="Mode"><button type="button" id="mDaily" aria-pressed="true">Daily</button><button type="button" id="mEndless" aria-pressed="false">Endless</button></div>
      <div class="sizes" id="sizes" role="group" aria-label="Board size" hidden><button type="button" data-z="0" aria-pressed="false">Small</button><button type="button" data-z="1" aria-pressed="true">Medium</button><button type="button" data-z="2" aria-pressed="false">Large</button></div>
      <button type="button" class="help" id="helpBtn" aria-label="How to play">?</button>
    </div>
  </header>

  <main class="work">
    <div class="left">
      <div class="stat"><span>Chips in place <b id="pl">0/0</b></span><span>Moves <b id="mv">0</b></span></div>
      <div class="mount" id="mount"><div class="grid" id="grid" role="grid" aria-label="Colour chips"></div><div class="shine"></div></div>
      <div class="coach" id="coach" aria-live="polite"></div>
      <div class="slip" id="slip" hidden></div>
    </div>
    <div class="right">
      <div class="fanwrap"><p class="sidehead">The four corners</p><div class="fan" id="fan"></div></div>
      <div class="stat"><span>Time <b id="clock">00:00</b></span><span id="hintn"></span></div>
      <div class="acts" id="acts"><button type="button" class="btn accent" id="hint">Hint</button><button type="button" class="btn paper" id="reset">Start over</button><button type="button" class="btn paper" id="giveup">Show answer</button></div>
      <section class="record" aria-label="Record"><h3 id="recT">Record</h3><div class="nums" id="nums"></div></section>
    </div>
  </main>
</div>

<div class="overlay" id="ov" hidden><div class="how" id="how" role="dialog" aria-modal="true" aria-labelledby="howT"></div></div>

<script>
// Swatch rules. No DOM in here, so the same file runs in the page and in node.
// A board is cols x rows paint chips. Four corner colours are blended across the board (in OKLab, so the
// blend looks smooth to the eye). Tile i belongs at position i. A few tiles are fixed; the rest are shuffled.

const EPOCH = '2026-11-09';

function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function dateKey(d) {
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function dayNumber(key) {
  const [y, m, d] = key.split('-').map(Number);
  const [ey, em, ed] = EPOCH.split('-').map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(ey, em - 1, ed)) / 86400000) + 1;
}
function fmtTime(ms) {
  const s = Math.floor(ms / 1000), p = (x) => String(x).padStart(2, '0');
  return p(Math.floor(s / 60)) + ':' + p(s % 60);
}

// ---- colour maths ----
function oklchToLab(L, C, hDeg) { const h = hDeg * Math.PI / 180; return [L, C * Math.cos(h), C * Math.sin(h)]; }
function labToLinear(lab) {
  const [L, a, b] = lab;
  const l_ = L + 0.3963377774 * a + 0.2158037573 * b, m_ = L - 0.1055613458 * a - 0.0638541728 * b, s_ = L - 0.0894841775 * a - 1.2914855480 * b;
  const l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
  return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
}
function inGamut(lin) { return lin.every((v) => v >= -0.0005 && v <= 1.0005); }
function toSrgb(lin) { return lin.map((v) => { v = Math.max(0, Math.min(1, v)); return Math.round(255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055)); }); }
function hex(rgb) { return '#' + rgb.map((v) => v.toString(16).padStart(2, '0')).join(''); }
function labDist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]); }

const HUE_NAMES = [[15, 'Rose'], [40, 'Coral'], [65, 'Clay'], [90, 'Honey'], [115, 'Olive'], [145, 'Fern'], [175, 'Jade'], [205, 'Teal'], [235, 'Harbour'], [265, 'Cobalt'], [295, 'Iris'], [325, 'Plum'], [352, 'Berry'], [361, 'Rose']];
const LIGHT_NAMES = ['Deep', 'Dusty', 'Soft', 'Faded', 'Pale'];
function colourName(lab) {
  const L = lab[0], C = Math.hypot(lab[1], lab[2]);
  let h = Math.atan2(lab[2], lab[1]) * 180 / Math.PI; if (h < 0) h += 360;
  let hue = 'Rose'; for (const [lim, nm] of HUE_NAMES) if (h <= lim) { hue = nm; break; }
  const adj = L < 0.5 ? 'Deep' : C < 0.07 ? 'Dusty' : L > 0.8 ? 'Pale' : L > 0.7 ? 'Soft' : C > 0.15 ? 'Bright' : 'Muted';
  return adj + ' ' + hue;
}

function makePuzzle(seedStr, cols, rows) {
  const rnd = mulberry32(hashStr('swatch/' + seedStr + '/' + cols + 'x' + rows));
  const n = cols * rows;
  for (let attempt = 0; attempt < 400; attempt++) {
    // four corners: top-left, top-right, bottom-left, bottom-right
    const h0 = rnd() * 360, spread = 70 + rnd() * 130;
    const hues = [h0, h0 + spread * (0.6 + rnd() * 0.8), h0 + spread * (0.7 + rnd() * 0.9) * (rnd() < 0.5 ? -1 : 1), h0 + spread * (1.2 + rnd())];
    const corners = [];
    for (let i = 0; i < 4; i++) {
      const L = 0.5 + rnd() * 0.36, C = 0.09 + rnd() * 0.1;
      let lab = oklchToLab(L, C, ((hues[i] % 360) + 360) % 360), c = C;
      while (!inGamut(labToLinear(lab)) && c > 0.02) { c -= 0.01; lab = oklchToLab(L, c, ((hues[i] % 360) + 360) % 360); }
      corners.push(lab);
    }
    let ok = true; for (let i = 0; i < 4 && ok; i++) for (let j = i + 1; j < 4; j++) if (labDist(corners[i], corners[j]) < 0.16) ok = false;
    if (!ok) continue;
    const labs = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const u = cols > 1 ? c / (cols - 1) : 0, v = rows > 1 ? r / (rows - 1) : 0, lab = [0, 0, 0];

  /* A 3x3 board sorts itself out on a loop: two swaps, then the gaps close and it becomes one wash. */
  function demo() {
    var corners = [oklchToLab(0.82, 0.13, 75), oklchToLab(0.66, 0.17, 12), oklchToLab(0.76, 0.1, 190), oklchToLab(0.45, 0.15, 285)], cols = [], i, k;
    for (i = 0; i < 9; i++) { var r = Math.floor(i / 3) / 2, c = i % 3 / 2, lab = [0, 0, 0]; for (k = 0; k < 3; k++) lab[k] = (1 - r) * ((1 - c) * corners[0][k] + c * corners[1][k]) + r * ((1 - c) * corners[2][k] + c * corners[3][k]); cols.push(hex(toSrgb(labToLinear(lab)))); }
    var arr = [0, 3, 2, 1, 7, 5, 6, 4, 8], css = '', step = 'calc(100% + 6px)';
    function mv(pos, to, a, b, ringA, ringB) {
      var dx = (to % 3) - (pos % 3), dy = Math.floor(to / 3) - Math.floor(pos / 3), tr = 'translate(calc(' + dx + ' * ' + step + '), calc(' + dy + ' * ' + step + '))';
      css += '@keyframes dm' + pos + '{0%,' + ringA + '%{transform:none;outline:3px solid transparent}' + (ringA + 3) + '%,' + (b - 1) + '%{transform:translateY(-3px) scale(1.05);outline:3px solid #2a2622;outline-offset:2px}' + b + '%{transform:translateY(-3px) scale(1.05);outline:3px solid #2a2622;outline-offset:2px}' + (b + 7) + '%,96%{transform:' + tr + ';outline:3px solid transparent}100%{transform:none;outline:3px solid transparent}}';
      css += '.dgrid .tile.m' + pos + '{animation:dm' + pos + ' var(--loop) infinite,dflat var(--loop) infinite;z-index:2}';
    }
    mv(1, 3, 0, 20, 8, 8); mv(3, 1, 0, 20, 12, 12);
    mv(4, 7, 0, 46, 34, 34); mv(7, 4, 0, 46, 38, 38);
    var h = '<div class="dgrid">';
    for (i = 0; i < 9; i++) h += '<div class="tile' + ([0, 2, 6, 8].indexOf(i) >= 0 ? ' fixed' : '') + ([1, 3, 4, 7].indexOf(i) >= 0 ? ' m' + i : '') + '" style="aspect-ratio:1;background:' + cols[arr[i]] + '"><span class="dot"></span></div>';
    return { css: css, html: h + '</div>' };
  }
  function howHtml(d) {
    var h = '<h2 id="howT">How to play</h2><p class="lead">The colours should melt smoothly from corner to corner. Put every chip back in its place.</p><div class="demo">' + d.html + '<div class="dcap"><span>The chips are jumbled. Tap one, then tap another.</span><span>They swap places. Keep going until the colours flow.</span><span>Chips with a white dot are fixed. They show you the way.</span><span>Smooth from corner to corner. Done.</span></div></div>';
    h += '<ol><li><span><b>Tap a chip, then tap another</b> to swap them. You can also drag one onto another.</span></li><li><span><b>Chips with a white dot stay put.</b> Use them as anchors and match the colours around them.</span></li><li><span><b>Stuck?</b> A hint puts one chip in its place for you.</span></li></ol>';
    h += '<div class="foot3"><p>Daily: same palette for everyone. Endless: three sizes.</p><button type="button" class="btn accent" id="howGo">Got it</button></div>';
    return h;
  }
  function openHow() {
    var d = demo(), st = document.createElement('style'); st.id = 'demoCss'; st.textContent = d.css; document.head.appendChild(st);
    $('how').innerHTML = howHtml(d); $('ov').hidden = false; store.seen = true; save(); $('howGo').addEventListener('click', closeHow); $('howGo').focus({ preventScroll: true });
  }
  function closeHow() {
    var ov = $('ov');
    function fin() { ov.hidden = true; $('how').innerHTML = ''; var s = $('demoCss'); if (s) s.remove(); try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) {} }
    var a = anim(ov, [{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: 'ease-out', fill: 'forwards' });
    if (a) a.onfinish = function () { a.cancel(); fin(); }; else fin();
  }
  $('helpBtn').addEventListener('click', openHow);
  $('ov').addEventListener('click', function (e) { if (e.target === $('ov')) closeHow(); });

  /* ---------- clock ---------- */
  function tick() {
    var now = new Date(), k = dateKey(now);
    if (k !== todayKey) { todayKey = k; dayNo = dayNumber(k); store.d = null; save(); if (S.mode === 'daily') init('daily'); return; }
    if (timerOn) $('clock').textContent = fmtTime(elapsed());
    var el = $('nextin'); if (!el) return;
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1), s = Math.max(0, Math.floor((next - now) / 1000)), p = function (n) { return String(n).padStart(2, '0'); };
    el.textContent = 'Next palette in ' + p(Math.floor(s / 3600)) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60);
  }
  setInterval(tick, 500);

  var h0 = location.hash.replace('#', '');
  init(h0 === 'endless' ? 'endless' : 'daily');
  if (!store.seen) setTimeout(function () { if (!store.seen) openHow(); }, 350);
})();
</script>
