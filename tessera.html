<style>
/* Layout: a mosaic being restored in a dark plaster wall niche. Centre-left, a pale plaster bed edged with
   a Greek key band holds the grid: limestone clue strips along the top and left, and a mortar-dark field of
   pits where stone tiles are laid by hand (each tile is cut a little differently). Right, the chisel tools,
   a carved timer, the result plaque and the record. When the picture is right, the tiles take their colours
   in a wave from the centre. On a phone everything stacks. */
:root {
  --wall: #2a1f1a; --wall2: #1d1512; --plaster: #dccdad; --plaster2: #cdbb97; --mortar: #4b392d; --ink: #3e3226; --muted: #8a7a62;
  --lime: #d9cfb8; --terra: #b0502f; --gold: #d3a44a; --cream: #f1e4c4;
  --serif: 'Marcellus', 'Trajan Pro', 'Palatino Linotype', Georgia, serif; --sans: 'Alegreya Sans', 'Segoe UI', 'Trebuchet MS', sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --grain: none; --key: none; --n: 7;
  --cell: clamp(30px, min(calc((100vw - 190px - 4.5vw) / var(--n)), calc((100dvh - 300px) / var(--n))), 64px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--wall2); }
body {
  margin: 0; min-height: 100dvh; color: var(--cream); font: 400 18px/1.4 var(--sans); position: relative; overflow-x: clip;
  background:
    var(--grain),
    radial-gradient(60% 45% at 50% -5%, rgba(255, 168, 80, 0.2), transparent 70%),
    radial-gradient(35% 50% at 100% 100%, rgba(255, 140, 60, 0.07), transparent 70%),
    repeating-linear-gradient(0deg, transparent 0 118px, rgba(0, 0, 0, 0.22) 118px 120px),
    repeating-linear-gradient(90deg, transparent 0 238px, rgba(0, 0, 0, 0.18) 238px 240px),
    linear-gradient(180deg, #33261f, var(--wall) 40%, var(--wall2));
  padding: 14px 0 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(100% 90% at 50% 40%, transparent 55%, rgba(0, 0, 0, 0.55) 100%); }
h1, h2, h3, p, ol, dl, dd { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
.wrap { position: relative; z-index: 1; max-width: 1380px; margin: 0 auto; }
.motes { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.motes i { position: absolute; border-radius: 50%; background: #ffcf95; opacity: 0; animation: mote var(--t) ease-in-out var(--d) infinite; }
@keyframes mote { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 0.7; } 80% { opacity: 0.4; } 100% { opacity: 0; transform: translate(var(--x), -180px); } }

/* ---------- header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 20px; padding: 6px 0 16px; }
.brand { display: flex; align-items: center; gap: 14px; }
.mark { width: 46px; height: 46px; flex: 0 0 auto; }
.mark rect { transform-box: fill-box; transform-origin: center; }
.brand h1 { font: 400 clamp(1.9rem, 4.6vw, 2.8rem)/1 var(--serif); letter-spacing: 0.2em; text-transform: uppercase; color: #e6d3a8; text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.7), 0 1px 0 rgba(255, 220, 160, 0.28), 0 3px 8px rgba(0, 0, 0, 0.5); }
.brand .sub { font: 500 0.92rem/1.2 var(--sans); letter-spacing: 0.1em; color: #a9977a; margin-top: 5px; text-transform: uppercase; }
.tools { display: flex; align-items: center; gap: 14px; }
.tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: rgba(0, 0, 0, 0.28); border-radius: 6px; padding: 3px; box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.55), 0 1px 0 rgba(255, 220, 160, 0.14); }
.tabs button { position: relative; z-index: 1; background: none; border: 0; cursor: pointer; padding: 9px 18px; font: 700 0.8rem/1 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: #a9977a; transition: color 0.5s; }
.tabs button[aria-pressed="true"] { color: #2c2018; }
.tabs .pill { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 4px; background: linear-gradient(#e8d29a, #c9a85a); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 2px 4px rgba(0, 0, 0, 0.5); transition: transform 0.7s var(--ease); }
.tabs[data-m="endless"] .pill { transform: translateX(100%); }
.help { width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer; font: 400 1.2rem/1 var(--serif); color: #e6d3a8; background: rgba(0, 0, 0, 0.28); box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.55), 0 1px 0 rgba(255, 220, 160, 0.14); transition: background 0.3s, transform 0.4s var(--ease); }
.help:hover { background: rgba(211, 164, 74, 0.25); transform: scale(1.08); }

/* ---------- layout ---------- */
.work { display: grid; grid-template-columns: auto minmax(300px, 1fr); gap: clamp(22px, 4vw, 64px); align-items: start; justify-content: center; }

/* ---------- plaster bed ---------- */
.bed {
  position: relative; padding: 46px clamp(16px, 2.4vw, 32px) 46px; border-radius: 5px;
  background:
    radial-gradient(24px 18px at 12% 14%, rgba(130, 95, 50, 0.16), transparent 70%),
    radial-gradient(40px 22px at 86% 70%, rgba(130, 95, 50, 0.13), transparent 70%),
    radial-gradient(18px 28px at 30% 92%, rgba(130, 95, 50, 0.12), transparent 70%),
    var(--grain), linear-gradient(160deg, #e6d9bb, var(--plaster) 50%, var(--plaster2));
  box-shadow: 0 0 0 3px #8e6a44, 0 0 0 5px #3b2a1d, 0 24px 40px -12px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.35), inset 0 0 40px rgba(120, 85, 40, 0.28);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
}
.bed::before, .bed::after { content: ""; position: absolute; left: 12px; right: 12px; height: 24px; background: var(--key) center / 24px 24px repeat-x; opacity: 0.8; pointer-events: none; }
.bed::before { top: 10px; } .bed::after { bottom: 10px; }
.cracks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.35; }
.field { position: relative; display: grid; grid-template-columns: auto repeat(var(--n), var(--cell)); grid-template-rows: auto repeat(var(--n), var(--cell)); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.corner { display: grid; place-items: end start; padding: 0 10px 8px 4px; }
.cc, .rc { display: flex; color: #4c3e2d; font: 700 clamp(0.8rem, calc(var(--cell) * 0.4), 1.15rem)/1 var(--serif); font-variant-numeric: tabular-nums; }
.cc { flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; padding: 0 0 6px; margin: 0 1px 4px; position: relative; border-radius: 5px 5px 2px 2px; background: var(--grain), linear-gradient(#d7cdb4, #c7bca1); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), inset 0 -2px 3px rgba(100, 80, 40, 0.3), 0 1px 2px rgba(60, 40, 15, 0.35); }
.rc { justify-content: flex-end; align-items: center; gap: 9px; padding: 0 10px 0 14px; margin: 1px 5px 1px 0; position: relative; border-radius: 5px 2px 2px 5px; background: var(--grain), linear-gradient(90deg, #c7bca1, #d7cdb4); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), inset -2px 0 3px rgba(100, 80, 40, 0.3), 0 1px 2px rgba(60, 40, 15, 0.35); }
.cc b, .rc b { font-weight: 700; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55), 0 -1px 0 rgba(60, 40, 15, 0.3); transition: opacity 0.6s; }
.cc::after, .rc::after { content: ""; position: absolute; background: var(--terra); border-radius: 2px; transform: scale(0); transition: transform 0.7s var(--ease); pointer-events: none; opacity: 0.85; }
.cc::after { top: 14%; bottom: 14%; left: 50%; width: 2.5px; margin-left: -1px; transform-origin: top; }
.rc::after { left: 10%; right: 8%; top: 50%; height: 2.5px; margin-top: -1px; transform-origin: left; }
.cc.ok, .rc.ok { filter: saturate(0.6) brightness(0.96); }
.cc.ok b, .rc.ok b { opacity: 0.38; }
.cc.ok::after { transform: scaleY(1); } .rc.ok::after { transform: scaleX(1); }
.cc.hot, .rc.hot { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), inset 0 0 0 2px var(--gold), 0 1px 2px rgba(60, 40, 15, 0.35); }
.pits { grid-column: 2 / -1; grid-row: 2 / -1; display: grid; grid-template-columns: repeat(var(--n), var(--cell)); grid-template-rows: repeat(var(--n), var(--cell)); background: var(--mortar); border-radius: 4px; box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.65), 0 0 0 3px #9b8566, 0 0 0 4px rgba(0, 0, 0, 0.3), 0 1px 0 4px rgba(255, 255, 255, 0.3); overflow: hidden; background-image: var(--grain), radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.05), transparent 60%); }
.cell { position: relative; border: 0; padding: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.cell::before { content: ""; position: absolute; inset: 3px; border-radius: var(--rad, 5px); background: rgba(20, 12, 6, 0.28); box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.55), 0 1px 0 rgba(255, 220, 170, 0.07); transition: background 0.3s; }
.cell:hover::before { background: rgba(255, 230, 190, 0.09); }
.cell.sel::before { box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.55), 0 0 0 2px rgba(211, 164, 74, 0.8); }
.tl { position: absolute; inset: var(--ins, 3px); border-radius: var(--rad); transform: rotate(var(--rot, 0deg)) scale(var(--sc, 1)); background: linear-gradient(var(--ang, 145deg), color-mix(in srgb, var(--col) 78%, white), var(--col) 52%, color-mix(in srgb, var(--col) 80%, black)); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.5), 0 4px 5px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.4), inset 0 0 0 1px rgba(0, 0, 0, 0.18); transition: background-color 0.9s ease; pointer-events: none; }
.tl::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--grain), radial-gradient(circle at var(--cx, 30%) var(--cy, 30%), rgba(255, 255, 255, 0.28), transparent 42%); mix-blend-mode: soft-light; }
.tl::before { content: ""; position: absolute; left: var(--fx, 62%); top: var(--fy, 58%); width: 14%; height: 9%; border-radius: 50%; background: rgba(0, 0, 0, 0.14); box-shadow: -8px -5px 0 rgba(0, 0, 0, 0.08); transform: rotate(var(--rot)); }

// Tessera rules. No DOM in here, so the same file runs in the page and in node.

const EPOCH = '2026-11-09';

function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function dateKey(d) {
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function dayNumber(key) {
  const [y, m, d] = key.split('-').map(Number);
  const [ey, em, ed] = EPOCH.split('-').map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(ey, em - 1, ed)) / 86400000) + 1;
}

// Lengths of the runs of filled cells in a line, in order. An empty line gives [].
function runs(line) {
  const out = []; let cur = 0;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === 1) cur++; else if (cur) { out.push(cur); cur = 0; }
  }
  if (cur) out.push(cur);
  return out;
}
function sameRuns(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}
function cluesOf(grid, n) {
  const rows = [], cols = [];
  for (let i = 0; i < n; i++) {
    rows.push(runs(grid.slice(i * n, i * n + n)));
    const c = []; for (let r = 0; r < n; r++) c.push(grid[r * n + i]);
    cols.push(runs(c));
  }
  return { rows, cols };
}

// Could this column, filled down to its current length, still match its clue?
function prefixOK(bits, clue, n) {
  const k = bits.length, done = [];
  let cur = 0;
  for (let i = 0; i < k; i++) { if (bits[i]) cur++; else if (cur) { done.push(cur); cur = 0; } }
  for (let i = 0; i < done.length; i++) if (done[i] !== clue[i]) return false;
  const ci = done.length;
  if (cur && (ci >= clue.length || cur > clue[ci])) return false;
  const remain = clue.slice(cur ? ci + 1 : ci);
  let need = remain.reduce((a, b) => a + b, 0);
  if (cur) need += clue[ci] - cur + (remain.length ? remain.length : 0);
  else need += Math.max(0, remain.length - 1);
  return need <= n - k;
}

// How many pictures fit these clues (stops counting at `cap`).
function countSolutions(rows, cols, n, cap) {
  const masks = [];
  for (let m = 0; m < (1 << n); m++) {
    const bits = []; for (let j = 0; j < n; j++) bits.push((m >> j) & 1);
    masks.push(bits);
  }
  const opts = rows.map((cl) => masks.filter((b) => sameRuns(runs(b), cl)));
  const colBits = []; for (let j = 0; j < n; j++) colBits.push([]);
  let found = 0;
  (function go(r) {
    if (found >= cap) return;
    if (r === n) { for (let j = 0; j < n; j++) if (!sameRuns(runs(colBits[j]), cols[j])) return; found++; return; }
    for (const b of opts[r]) {
      let ok = true;
      for (let j = 0; j < n; j++) colBits[j].push(b[j]);
      for (let j = 0; j < n && ok; j++) ok = prefixOK(colBits[j], cols[j], n);
      if (ok) go(r + 1);
      for (let j = 0; j < n; j++) colBits[j].pop();
      if (found >= cap) return;
    }
  })(0);
  return found;
}

// A picture for this seed: filled cells as 1, with clues that only one picture satisfies when we can manage it.
function makePuzzle(seedStr, n) {
  const rnd = mulberry32(hashStr('tessera/' + seedStr + '/' + n));
  let best = null;
  for (let attempt = 0; attempt < 900; attempt++) {
    const sym = attempt < 500, g = new Array(n * n).fill(0), p = 0.5 + rnd() * 0.12;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (sym && c > (n - 1) / 2) g[r * n + c] = g[r * n + (n - 1 - c)];
      else g[r * n + c] = rnd() < p ? 1 : 0;
    }
    const cl = cluesOf(g, n);
    if (cl.rows.some((x) => !x.length) || cl.cols.some((x) => !x.length)) continue;
    const filled = g.reduce((a, b) => a + b, 0);
    if (filled < n * n * 0.38 || filled > n * n * 0.72) continue;
    if (!best) best = { grid: g, clues: cl, unique: false };
    if (countSolutions(cl.rows, cl.cols, n, 2) === 1) return { grid: g, clues: cl, unique: true };
  }
  return best;
}

// Rows and columns whose laid tiles already match their clue.
function satisfied(state, clues, n) {
  const rows = [], cols = [];
  for (let i = 0; i < n; i++) {
    const row = state.slice(i * n, i * n + n).map((v) => (v === 1 ? 1 : 0));
    const col = []; for (let r = 0; r < n; r++) col.push(state[r * n + i] === 1 ? 1 : 0);
    rows.push(sameRuns(runs(row), clues.rows[i]));
    cols.push(sameRuns(runs(col), clues.cols[i]));
  }
  return { rows, cols, all: rows.every(Boolean) && cols.every(Boolean) };
}

function fmtTime(ms) {
  const s = Math.floor(ms / 1000), p = (x) => String(x).padStart(2, '0');
  return p(Math.floor(s / 60)) + ':' + p(s % 60);
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { EPOCH, hashStr, mulberry32, dateKey, dayNumber, runs, sameRuns, cluesOf, countSolutions, makePuzzle, satisfied, fmtTime };
}

      var sty = '--rot:' + ((r() - 0.5) * 5).toFixed(1) + 'deg;--rad:6px;--ins:3px;--ang:140deg;--cx:30%;--cy:30%;--fx:60%;--fy:60%;';
      h += '<span class="cell" style="' + sty + '">';
      if (v) h += '<span class="tl" style="--s:' + starts[k] + '%;--fin:' + fin[k] + ';animation-name:dl' + k + ',dcol"></span>';
      else h += '<svg class="gap" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3L17 17M17 3L3 17" pathLength="1"/></svg>';
      h += '</span>';
    });
    h += '</div></div>';
    h += '<ol><li><span><b>Read the numbers.</b> A number says how many tiles go in a row in that line. <b>3</b> means three tiles side by side.</span></li>' +
      '<li><span><b>Tap to place tiles.</b> Tap a square to place a tile, tap again to remove it. Use <b>Empty</b> to mark squares that stay blank.</span></li>' +
      '<li><span><b>Cross out every number.</b> A number is crossed out when its line is right. Do them all to win.</span></li></ol>';
    h += '<div class="foot"><p>Daily: same puzzle for everyone. Endless: a new one every time.</p><button type="button" class="btn hot" id="howGo">Got it</button></div>';
    return h;
  }
  function openHow() {
    $('how').innerHTML = howHtml(); $('ov').hidden = false; store.seen = true; save();
    $('howGo').addEventListener('click', closeHow); $('howGo').focus({ preventScroll: true });
  }
  function closeHow() {
    var ov = $('ov');
    function fin() { ov.hidden = true; $('how').innerHTML = ''; try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) {} }
    var a = anim(ov, [{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: 'ease-out', fill: 'forwards' });
    if (a) a.onfinish = function () { a.cancel(); fin(); }; else fin();
  }
  $('helpBtn').addEventListener('click', openHow);
  $('ov').addEventListener('click', function (e) { if (e.target === $('ov')) closeHow(); });

  /* ---------- clock ---------- */
  function tick() {
    var now = new Date(), k = dateKey(now);
    if (k !== todayKey) { todayKey = k; dayNo = dayNumber(k); store.d = null; save(); if (S.mode === 'daily') init('daily'); return; }
    if (timerOn) $('time').textContent = fmtTime(elapsed());
    var el = $('nextin'); if (!el) return;
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1), s = Math.max(0, Math.floor((next - now) / 1000)), p = function (n) { return String(n).padStart(2, '0'); };
    el.textContent = 'Next mosaic in ' + p(Math.floor(s / 3600)) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60);
  }
  setInterval(tick, 500);

  var h0 = location.hash.replace('#', '');
  init(h0 === 'endless' ? 'endless' : 'daily');
  if (!store.seen) setTimeout(function () { if (!store.seen) openHow(); }, 350);
})();
</script>
